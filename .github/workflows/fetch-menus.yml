name: Fetch menu snapshot

on:
  schedule:
    # Target window: 05:00-15:00 Europe/Zurich, every 5 min, Mon-Fri.
    # Cron is UTC-only and cannot follow DST, so instead of guessing the
    # offset this fires over the UNION of both seasons (03:00-14:55 UTC,
    # i.e. CEST 05:00-16:55 / CET 04:00-15:55) and the step below trims to
    # the real local window with a TZ=Europe/Zurich check. That is exact
    # across both DST switchovers, at the cost of ~24 no-op runs a day
    # which exit before making any API call.
    # 5 min is GitHub's floor for scheduled workflows, and a best-effort
    # one - runs are delayed under load, so treat the real resolution as
    # "5 min or worse". The unchanged-snapshot check below is what keeps
    # the runs from becoming an equal number of commits.
    - cron: '*/5 3-14 * * 1-5'
  workflow_dispatch:

concurrency:
  group: fetch-menu-snapshot

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch today's menus and append a snapshot line
        run: |
          set -euo pipefail

          # Trim the union-window cron to the real 05:00-15:00 Europe/Zurich
          # window. 10# forces base 10 so a leading-zero hour like 0800 is
          # not read as octal.
          LOCAL_HM=$(TZ=Europe/Zurich date +%H%M)
          if [ "$((10#$LOCAL_HM))" -lt 500 ] || [ "$((10#$LOCAL_HM))" -gt 1500 ]; then
            echo "$(TZ=Europe/Zurich date +%H:%M) Zurich is outside 05:00-15:00, skipping."
            echo "SNAPSHOT_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          BASE='https://idapps.ethz.ch/cookpit-pub-services/v1'
          CLIENT_ID='ethz-wcms'
          TODAY=$(TZ=Europe/Zurich date +%Y-%m-%d)
          # Written now, before the possible early exit below, so later
          # steps in this job can still see it via $GITHUB_ENV.
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          TOMORROW=$(TZ=Europe/Zurich date -d '+1 day' +%Y-%m-%d)
          ISOWD=$(TZ=Europe/Zurich date +%u)
          FETCHED_AT=$(date -u +%FT%TZ)
          IDS=$(grep -oP '[?&]id=\K\d+' websites.txt | sort -u)

          mkdir -p data
          TMP=$(mktemp -d)

          # Per facility: fetch its info + full weekly rota, then narrow the
          # rota down to just today's day-entry (matching the client's
          # findTodayEntry) so we archive one day's menu, not a redundant
          # copy of the whole week on every run.
          # --max-time/--retry: a facility fetch that times out or 5xxs
          # would otherwise fall through to `echo null` below and get
          # archived as a fabricated "no menu today" - see the validation
          # right after.
          CURL='curl -sf --max-time 15 --retry 2'

          for lang in en de; do
            : > "$TMP/$lang.jsonl"
            for id in $IDS; do
              info=$($CURL "$BASE/facilities/$id?client-id=$CLIENT_ID&lang=$lang" || echo null)
              rota=$($CURL "$BASE/weeklyrotas?client-id=$CLIENT_ID&lang=$lang&rs-first=0&rs-size=50&valid-after=$TODAY&valid-before=$TOMORROW&facility=$id" || echo null)

              # A failed info fetch is not "this canteen served nothing today"
              # - it's a broken sweep. Require a real facility-name (no
              # "Mensa <id>" placeholder) instead of archiving a guess, and
              # abandon the run rather than append a partial snapshot.
              #
              # Warning + exit 0, not error + exit 1: skipping IS the correct
              # handling here, and at ~120 runs a weekday a red X on every
              # transient upstream blip would train us to ignore red X. A gap
              # in the archive is the intended outcome; the browser falls back
              # to the live API regardless. A sustained outage shows up as the
              # archive quietly not growing.
              if ! jq -e '. != null and (."facility-name" // "") != ""' >/dev/null 2>&1 <<<"$info"; then
                echo "::warning::Incomplete sweep: facility $id ($lang) fetch failed or returned no facility-name, skipping without appending."
                echo "SNAPSHOT_CHANGED=false" >> "$GITHUB_ENV"
                rm -rf "$TMP"
                exit 0
              fi

              jq -n -c --arg id "$id" --argjson info "$info" --argjson rota "$rota" \
                --arg today "$TODAY" --argjson isowd "$ISOWD" '
                ([$rota["weekly-rota-array"][]? | select($today >= ."valid-from" and $today <= ."valid-to")][0]) as $week
                | ([$week["day-of-week-array"][]? | select(."day-of-week-code" == $isowd)][0]) as $day
                | {id: $id, name: $info["facility-name"], url: $info["facility-url"], dayEntry: ($day // null)}
              ' >> "$TMP/$lang.jsonl"
            done
            jq -s '.' "$TMP/$lang.jsonl" > "$TMP/$lang.json"
          done

          NEW=$(jq -n -c --arg fetchedAt "$FETCHED_AT" --slurpfile en "$TMP/en.json" --slurpfile de "$TMP/de.json" \
            '{fetchedAt: $fetchedAt, facilities: {en: $en[0], de: $de[0]}}')

          rm -rf "$TMP"

          # Skip the append entirely if the menu content is unchanged from
          # the last snapshot line, ignoring fetchedAt so a bare timestamp
          # bump doesn't count as a change. SNAPSHOT_CHANGED gates the two
          # steps below: no new snapshot line means no stats rebuild and no
          # commit, so a quiet day costs one API sweep and nothing else.
          SNAPSHOT="data/$TODAY.jsonl"
          LAST=$([ -f "$SNAPSHOT" ] && tail -n 1 "$SNAPSHOT" || true)
          if [ -n "$LAST" ] && [ "$(jq -c '.facilities' <<<"$LAST")" = "$(jq -c '.facilities' <<<"$NEW")" ]; then
            echo "No menu changes since last snapshot, skipping."
            echo "SNAPSHOT_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "$NEW" >> "$SNAPSHOT"
          echo "SNAPSHOT_CHANGED=true" >> "$GITHUB_ENV"

      # The `hashFiles` clause is a self-heal for the two DERIVABLE outputs:
      # if data/stats.json or data/dishes.csv goes missing it is rebuilt on
      # the next run rather than waiting for a menu change.
      #
      # data/dish-ids.json is deliberately NOT self-healed. It is the source
      # of truth for dish identity, and ids are assigned in first-seen order
      # rather than derived, so "rebuilding" it does not restore it - it
      # mints different numbers. Measured on this archive, day-by-day
      # allocation and a one-shot rebuild agree on only 6 of 96 ids. A
      # self-heal would therefore orphan every local rating and saved link
      # while reporting success. If it goes missing the build fails loudly
      # and a human restores it from git history.
      # OUTPUTS_REBUILT is set explicitly (rather than re-checking hashFiles
      # in the commit step below) because hashFiles is re-evaluated live -
      # by the time the commit step's `if` runs, the rebuild above has
      # already created the file, so a hashFiles-only check would find it
      # present and skip the commit that was supposed to save it.
      - name: Rebuild stats.json
        if: env.SNAPSHOT_CHANGED == 'true' || hashFiles('data/stats.json') == '' || hashFiles('data/dishes.csv') == ''
        run: |
          python3 tools/build_stats.py
          echo "OUTPUTS_REBUILT=true" >> "$GITHUB_ENV"

      - name: Commit and push if anything changed
        if: env.SNAPSHOT_CHANGED == 'true' || env.OUTPUTS_REBUILT == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m "Menu snapshot for $TODAY $(TZ=Europe/Zurich date '+%H:%M %Z')"
          git push
