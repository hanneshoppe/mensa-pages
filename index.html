<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensa Menus</title>
<style>
  :root {
    --bg: #f7f5f2;
    --card-bg: #ffffff;
    --text: #1f2320;
    --muted: #6b7168;
    --border: #e4e0da;
    --accent: #2f5233;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 28px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
  }
  .date-line {
    color: var(--muted);
    font-size: 0.95rem;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .stats-link {
    color: var(--muted);
    font-size: 0.85rem;
    text-decoration: none;
    margin-left: auto;
  }
  .stats-link:hover { text-decoration: underline; }
  .toggle-group {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .toggle-btn {
    border: none;
    background: var(--card-bg);
    color: var(--text);
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .toggle-btn + .toggle-btn {
    border-left: 1px solid var(--border);
  }
  .toggle-btn.active {
    background: var(--accent);
    color: #fff;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  section.facility h2 {
    margin: 0 0 2px;
    font-size: 1.25rem;
  }
  section.facility h2 a {
    color: var(--text);
    text-decoration: none;
  }
  section.facility h2 a:hover {
    text-decoration: underline;
  }
  .meal-time-label {
    color: var(--muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 14px 0 8px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card.sold-out {
    opacity: 0.55;
    filter: grayscale(70%);
  }
  .card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: var(--border);
    display: block;
  }
  .card img.contain {
    object-fit: contain;
  }
  .card-body {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .card-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .card-title {
    font-weight: 600;
    font-size: 0.98rem;
    line-height: 1.25;
  }
  .badge {
    flex-shrink: 0;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    color: #fff;
    white-space: nowrap;
  }
  .badge-O { background: #a35d3a; }
  .badge-V- { background: #7ea364; }
  .badge-V { background: #3f7d3f; }
  .card-desc {
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.35;
    white-space: pre-line;
  }
  .card-price {
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    margin-top: 2px;
  }
  .empty-note, .error-note {
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
  }
  .error-note { color: #a33; }
  .loading {
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
  }
  .rating-note {
    color: var(--muted);
    font-size: 0.75rem;
    font-style: italic;
    margin-top: 6px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .rating {
    border: 0;
    margin: 4px 0 0;
    padding: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .rating-stars {
    display: inline-flex;
    align-items: baseline;
    gap: 1px;
  }
  .rating-stars label {
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    color: var(--border);
    padding: 1px 2px;
    border-radius: 2px;
  }
  .rating-stars label.filled { color: #c9972f; }
  .rating-stars label.rating-zero {
    font-size: 0.65rem;
    color: var(--muted);
    padding: 1px 3px;
  }
  .rating-stars label.rating-zero.selected {
    color: var(--text);
    font-weight: 700;
  }
  .rating-stars input.sr-only:focus-visible + label {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .rating-clear {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
  }
  .rating-clear:hover { color: var(--text); }

  /* List view: same markup, row layout instead of a card grid */
  #app.list-view .cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #app.list-view .card {
    flex-direction: row;
    align-items: center;
  }
  #app.list-view .card img {
    width: auto;
    height: 84px;
    aspect-ratio: 4 / 3;
    flex-shrink: 0;
  }
  #app.list-view .card-body {
    padding: 8px 12px;
    flex: 1;
    min-width: 0;
  }
  #app.list-view .card-title {
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #app.list-view .card-desc {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<header>
  <h1 id="titleText">Mensa Menus</h1>
  <div class="date-line" id="dateLine"></div>
  <div class="controls">
    <div class="toggle-group" role="group" aria-label="Language">
      <button type="button" class="toggle-btn" data-lang="de">DE</button>
      <button type="button" class="toggle-btn" data-lang="en">EN</button>
    </div>
    <div class="toggle-group" role="group" aria-label="View">
      <button type="button" class="toggle-btn" data-view="cards">Cards</button>
      <button type="button" class="toggle-btn" data-view="list">List</button>
    </div>
    <a class="stats-link" href="stats.html">Stats</a> <!-- href rewritten in JS to carry ?lang= -->
  </div>
  <div class="rating-note" id="ratingNote"></div>
</header>
<main id="app">
  <div class="loading">Loading…</div>
</main>

<script>
// Client for ETH's public Cookpit menu API (the same one ethz.ch's own menu
// pages call). Responses are cached in localStorage since the API sends no
// Cache-Control/ETag of its own.
const CookpitClient = (() => {
  const BASE_URL = 'https://idapps.ethz.ch/cookpit-pub-services/v1/';
  const CLIENT_ID = 'ethz-wcms';
  const CACHE_TTL_MS = 5 * 60 * 1000;

  function cacheGet(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const { timestamp, data } = JSON.parse(raw);
      if (Date.now() - timestamp > CACHE_TTL_MS) return null;
      return data;
    } catch (err) {
      return null;
    }
  }

  function cacheSet(key, data) {
    try {
      localStorage.setItem(key, JSON.stringify({ timestamp: Date.now(), data }));
    } catch (err) {
      // Storage unavailable (private browsing, quota, …) — just skip caching.
    }
  }

  // opts.force skips the cached read (but still writes the fresh response
  // back to cache) — used by the background live re-check so it can't be
  // answered by a stale, possibly-older-than-the-snapshot cache entry.
  async function getJson(url, cacheKey, opts = {}) {
    if (!opts.force) {
      const cached = cacheGet(cacheKey);
      if (cached) return cached;
    }
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    cacheSet(cacheKey, data);
    return data;
  }

  function getFacility(id, lang, opts) {
    const url = `${BASE_URL}facilities/${id}?client-id=${CLIENT_ID}&lang=${lang}`;
    return getJson(url, `mensa:facility:${id}:${lang}`, opts);
  }

  function getWeeklyRota(id, lang, validAfter, validBefore, opts) {
    const url = `${BASE_URL}weeklyrotas?client-id=${CLIENT_ID}&lang=${lang}&rs-first=0&rs-size=50` +
      `&valid-after=${validAfter}&valid-before=${validBefore}&facility=${id}`;
    return getJson(url, `mensa:rota:${id}:${lang}:${validAfter}`, opts);
  }

  function imageUrl(meal) {
    if (meal.__rawImage) return meal.__rawImage;
    if (!meal['image-url']) return null;
    return `${meal['image-url']}?client-id=${CLIENT_ID}`;
  }

  return { getFacility, getWeeklyRota, imageUrl };
})();

const VEGAN_LABELS = ['Vegan'];
const VEGETARIAN_LABELS = ['Vegetarisch', 'Vegetarian'];
const SOLD_OUT_LABELS = ['Ausverkauft', 'Sold Out'];
const DIET_ORDER = { V: 0, 'V-': 1, O: 2 };

// Hidden easter egg for FUSION, enabled via ?ea=1.
const EASTER_EGG_IMAGE = 'https://cdn.creazilla.com/cliparts/60279/sad-face-clipart-md.png';
const EASTER_EGG_CONTENT = {
  de: { name: 'Nichts Gutes', description: 'hier gehen Träume und Ziele zum sterben hin' },
  en: { name: 'Nothing Good', description: 'dying hopes and dreams' },
};

const STRINGS = {
  de: {
    title: 'Mensa Menüs',
    loading: 'Lade Menüs…',
    noMenuToday: 'Heute keine Menüs verfügbar.',
    loadError: 'Konnte websites.txt nicht laden.',
    noFacilities: 'Keine Mensen gefunden.',
    dateLocale: 'de-CH',
    rateLabel: 'Gericht bewerten',
    clearRating: 'Bewertung löschen',
    ratingNote: 'Bewertungen werden nur in diesem Browser gespeichert – nicht synchronisiert, weg wenn Website-Daten gelöscht werden.',
  },
  en: {
    title: 'Mensa Menus',
    loading: 'Loading menus…',
    noMenuToday: 'No menus available today.',
    loadError: 'Could not load websites.txt.',
    noFacilities: 'No canteens found.',
    dateLocale: 'en-GB',
    rateLabel: 'Rate this dish',
    clearRating: 'Clear rating',
    ratingNote: 'Ratings are stored only in this browser — not synced, gone if site data is cleared.',
  },
};

// "n of 5 stars" / "n von 5 Sternen" — parametrized, so it stays a plain
// function rather than living in STRINGS (whose other values are static text).
function starLabel(lang, n) {
  return lang === 'de' ? `${n} von 5 Sternen` : `${n} of 5 stars`;
}

const facilitiesPromises = {}; // "date:lang" -> Promise<{facilities, fromSnapshot}>
let idsPromise = null;
let renderToken = 0; // monotonic guard so a stale async render can't paint over a newer one
let renderedDateStr = null; // Zurich date last rendered, to detect a midnight rollover

// --- Local star ratings (TODO item 6) --------------------------------------
//
// Ratings key on the numeric dish id from data/dish-ids.json, not on the
// dish name, so a rename recorded in that registry keeps its rating. A dish
// the registry doesn't know yet (brand new today) gets a provisional
// "name:<facility>|<name_en>" key and is migrated onto the numeric id once
// the registry catches up (see migrateProvisionalRatings). Own localStorage
// key, deliberately not CookpitClient's cache helper — that one has a
// 5-minute TTL and would discard ratings almost immediately.
const RATINGS_KEY = 'mensaDishRatings';
const RATING_MAX_AGE_MS = 365 * 24 * 60 * 60 * 1000; // 1 year
const RATING_MAX_FUTURE_MS = 24 * 60 * 60 * 1000; // tolerate up to a day of clock skew
let ratingsCache = null; // lazy in-memory mirror, so ratings still work for
                          // this session even if localStorage itself is
                          // unavailable (private browsing) or write fails.

// Reads, validates and prunes (>1 year old) the stored ratings. Never
// throws: corrupt JSON, out-of-range stars, bad timestamps or a missing
// localStorage all just fall back to an empty ratings set.
function loadRatings() {
  if (ratingsCache) return ratingsCache;
  let ratings = {};
  try {
    const raw = localStorage.getItem(RATINGS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') ratings = parsed;
    }
  } catch (err) {
    ratings = {};
  }
  const now = Date.now();
  let pruned = false;
  for (const [key, entry] of Object.entries(ratings)) {
    const stars = entry && entry.stars;
    const time = entry && Date.parse(entry.ts);
    const age = now - time; // negative when ts is in the future
    const valid = Number.isInteger(stars) && stars >= 0 && stars <= 5 && !Number.isNaN(time) && age > -RATING_MAX_FUTURE_MS;
    if (!valid || age > RATING_MAX_AGE_MS) {
      delete ratings[key];
      pruned = true;
    }
  }
  ratingsCache = ratings;
  if (pruned) saveRatings(ratings);
  return ratings;
}

function saveRatings(ratings) {
  ratingsCache = ratings;
  try {
    localStorage.setItem(RATINGS_KEY, JSON.stringify(ratings));
  } catch (err) {
    // Storage unavailable (private browsing, quota, …) — ratingsCache still
    // makes ratings work for the rest of this session, they just won't
    // survive a reload.
  }
}

function getRating(dishId) {
  const entry = loadRatings()[dishId];
  return entry ? entry.stars : null;
}

// 0 is a real, storable rating — the caller passing it here is exactly what
// distinguishes it from "unrated" (an absent key, see clearRatingFor).
function setRating(dishId, stars) {
  const ratings = loadRatings();
  ratings[dishId] = { stars, ts: new Date().toISOString() };
  saveRatings(ratings);
}

function clearRatingFor(dishId) {
  const ratings = loadRatings();
  delete ratings[dishId];
  saveRatings(ratings);
}

// data/dish-ids.json: {"<id>": [["facility", "name_en"], ...], "_readme": …}.
// Flattened into (facility|name_en) -> id, covering every name a dish has
// ever been recorded under (a rename appends a second pair to the same id).
function buildDishIdLookup(registry) {
  const lookup = new Map();
  for (const [id, pairs] of Object.entries(registry || {})) {
    if (id === '_readme') continue;
    for (const [facility, nameEn] of pairs) {
      lookup.set(`${facility}|${nameEn}`, id);
    }
  }
  return lookup;
}

// Moves any provisional "name:<facility>|<name_en>" rating onto its real
// numeric id now that the registry knows it. Idempotent (a migrated key is
// gone from ratings, so a repeat run finds nothing left to do) and never
// overwrites a rating already stored under the numeric id.
function migrateProvisionalRatings(dishIdLookup) {
  const ratings = loadRatings();
  let changed = false;
  for (const key of Object.keys(ratings)) {
    if (!key.startsWith('name:')) continue;
    const id = dishIdLookup.get(key.slice(5));
    if (id) {
      // Keep whichever of the two is newer rather than unconditionally
      // keeping the id-keyed one — the provisional entry can be the newer
      // rating (e.g. rated again while the registry fetch was failing), and
      // discarding it unconditionally would lose the reader's latest vote.
      const existing = ratings[id];
      if (!existing || Date.parse(ratings[key].ts) >= Date.parse(existing.ts)) {
        ratings[id] = ratings[key];
      }
      delete ratings[key];
      changed = true;
    }
  }
  if (changed) saveRatings(ratings);
}

// Resolves to the (facility|name_en) -> id lookup Map, or to null if the
// registry couldn't be loaded at all this run. null is deliberately distinct
// from an empty-but-loaded Map: a transient fetch failure must not look like
// "every dish is unregistered", or every rating would fall back to a
// provisional key and later be discarded by migrateProvisionalRatings once
// the registry does load and finds an existing numeric entry in the way.
let dishIdLookupPromise = null;
function getDishIdLookupCached() {
  if (!dishIdLookupPromise) {
    dishIdLookupPromise = fetch('data/dish-ids.json')
      .then(res => res.ok ? res.json() : Promise.reject(new Error(`dish-ids.json fetch failed: ${res.status}`)))
      .then(buildDishIdLookup)
      .catch(() => null) // registry unreachable this load — see comment above
      .then(lookup => { if (lookup) migrateProvisionalRatings(lookup); return lookup; });
  }
  return dishIdLookupPromise;
}

// Flattens a dayEntry down to every {name, meal} line that actually has a
// dish, same traversal tools/build_stats.py's iter_lines does server-side.
function allLines(dayEntry) {
  const lines = [];
  for (const oh of (dayEntry && dayEntry['opening-hour-array']) || []) {
    for (const mealTime of oh['meal-time-array'] || []) {
      for (const line of mealTime['line-array'] || []) {
        if (line.meal) lines.push(line);
      }
    }
  }
  return lines;
}

// The registry keys on English (facility, name) pairs, but this page can be
// showing German. Build (facility-id|line-id) -> English identity from the
// *English* facilities of the same day/snapshot so a German-displayed dish
// can still be resolved to its English pair — line-id is only unique within
// one day, so this map is rebuilt per render, never cached globally.
function buildEnIdentityMap(enFacilities) {
  const map = new Map();
  for (const f of enFacilities) {
    for (const line of allLines(f.dayEntry)) {
      const lineId = line.meal['line-id'];
      if (lineId == null) continue;
      if (isSoldOut(line.meal)) continue; // a sold-out placeholder isn't a real dish identity
      map.set(`${f.id}|${lineId}`, { facility: f.name, name: line.meal.name });
    }
  }
  return map;
}

// Bundles what renderMealCard needs to key a rating: the dish-id lookup, and
// (only in German) the English-identity map to resolve the card's facility
// id + line-id against it. Built once per render, reusing the already
// memoized facilities fetch so this costs nothing extra in English.
async function buildRatingCtx(lang, strings, todayStr, tomorrowStr, todayIso) {
  const dishIdLookup = await getDishIdLookupCached();
  let enIdentityMap = null;
  if (lang !== 'en') {
    try {
      const { facilities: enFacilities } = await getFacilitiesData('en', todayStr, tomorrowStr, todayIso);
      enIdentityMap = buildEnIdentityMap(enFacilities);
    } catch (err) {
      enIdentityMap = null; // English data unavailable this render — rating widgets skip rather than mis-key
    }
  }
  return { lang, strings, dishIdLookup, enIdentityMap };
}

// The English (facility, name) pair identifying a dish, used both as the
// dish-id lookup key and as the provisional key. Returns null when it can't
// be determined (no English line-id counterpart found this render).
function resolveDishIdentity(meal, facility, ratingCtx) {
  if (ratingCtx.lang === 'en') return { facility: facility.name, name: meal.name };
  if (!ratingCtx.enIdentityMap) return null;
  const lineId = meal['line-id'];
  if (lineId == null) return null;
  return ratingCtx.enIdentityMap.get(`${facility.id}|${lineId}`) || null;
}

let ratingWidgetSeq = 0;

// Real radio-group semantics: six <input type="radio"> (0..5, 0 a real
// rating, distinct from nothing selected = unrated), visually hidden but
// focusable so arrow-key navigation and accessible names come from the
// browser's native radiogroup behaviour rather than reimplemented JS.
function renderRatingWidget(dishId, lang, strings) {
  const uid = `rating-${ratingWidgetSeq++}`;
  const fieldset = document.createElement('fieldset');
  fieldset.className = 'rating';
  fieldset.setAttribute('aria-describedby', 'ratingNote');
  fieldset.dataset.dishId = dishId; // not read by any app code; just makes the resolved key inspectable

  const legend = el('legend', 'sr-only', strings.rateLabel);
  fieldset.append(legend);

  const starsWrap = el('div', 'rating-stars');
  const stars = [];
  for (let n = 0; n <= 5; n++) {
    const id = `${uid}-${n}`;
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = uid;
    input.id = id;
    input.value = String(n);
    input.className = 'sr-only';
    const label = document.createElement('label');
    label.htmlFor = id;
    label.textContent = n === 0 ? '0' : '★';
    label.setAttribute('aria-label', starLabel(lang, n));
    if (n === 0) label.classList.add('rating-zero');
    starsWrap.append(input, label);
    stars.push({ input, label, n });
  }
  fieldset.append(starsWrap);

  const clearBtn = document.createElement('button');
  clearBtn.type = 'button';
  clearBtn.className = 'rating-clear';
  clearBtn.textContent = '×';
  clearBtn.setAttribute('aria-label', strings.clearRating);
  fieldset.append(clearBtn);

  function paint(current) {
    for (const { label, n } of stars) {
      label.classList.toggle('filled', current != null && n >= 1 && n <= current);
      label.classList.toggle('selected', current === n);
    }
    clearBtn.style.visibility = current == null ? 'hidden' : 'visible';
  }

  const current = getRating(dishId);
  if (current != null) stars[current].input.checked = true;
  paint(current);

  starsWrap.addEventListener('change', () => {
    const picked = stars.find(s => s.input.checked);
    if (!picked) return;
    setRating(dishId, picked.n);
    paint(picked.n);
  });

  clearBtn.addEventListener('click', () => {
    clearRatingFor(dishId);
    for (const { input } of stars) input.checked = false;
    paint(null);
  });

  return fieldset;
}
// --- end local star ratings --------------------------------------------

function pad(n) { return String(n).padStart(2, '0'); }

// This page shows ETH Zürich menus, so "today" always means Zurich's
// calendar date — never the viewer's own timezone. Locale is irrelevant
// here since parts are read by type, not by position (house pattern, see
// stats.html's formatDataAsOf).
function zurichDateParts(d) {
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Zurich', year: 'numeric', month: '2-digit', day: '2-digit',
  }).formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
}

function formatDate(parts) {
  return `${parts.year}-${parts.month}-${parts.day}`;
}

// Advances a Zurich calendar date by one day. Uses Date.UTC purely as a
// calendar calculator (not a real instant), so it advances the date exactly
// once regardless of the 23-/25-hour days around a DST transition — adding
// a fixed 24h in milliseconds would not be safe here.
function nextDay(parts) {
  const d = new Date(Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day) + 1));
  return { year: String(d.getUTCFullYear()), month: pad(d.getUTCMonth() + 1), day: pad(d.getUTCDate()) };
}

// ISO weekday: Monday=1 ... Sunday=7, matching the API's day-of-week-code.
// Computed from the Zurich calendar date (not the viewer's), via the same
// Date.UTC-as-calendar trick as nextDay.
function isoWeekday(parts) {
  const day = new Date(Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day))).getUTCDay();
  return ((day + 6) % 7) + 1;
}

// Bundles the Zurich "today" needed everywhere: the snapshot filename, the
// API's valid-after/valid-before range, and the weekday used to pick
// today's rota entry — all derived from one Zurich calendar date so they
// can never disagree. `now` is the instant they were derived from, for
// callers that also want to display it.
function zurichDateContext() {
  const now = new Date();
  const today = zurichDateParts(now);
  const tomorrow = nextDay(today);
  return { now, todayStr: formatDate(today), tomorrowStr: formatDate(tomorrow), todayIso: isoWeekday(today) };
}

function getStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const lang = params.get('lang') === 'de' ? 'de' : 'en';
  const view = params.get('view') === 'list' ? 'list' : 'cards';
  const easterEgg = params.get('ea') === '1';
  return { lang, view, easterEgg };
}

function updateUrl(state) {
  const params = new URLSearchParams(window.location.search);
  params.set('lang', state.lang);
  params.set('view', state.view);
  history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
}

// Keeps the outgoing link to stats.html in sync with the current language,
// so following it (or the mirror-image link back) doesn't drop the choice.
function updateStatsLink(state) {
  document.querySelector('.stats-link').href = `stats.html?lang=${state.lang}`;
}

async function getFacilityIds() {
  const res = await fetch('websites.txt');
  if (!res.ok) throw new Error(`websites.txt fetch failed: ${res.status}`);
  const text = await res.text();
  const ids = [...text.matchAll(/[?&]id=(\d+)/g)].map(m => m[1]);
  return [...new Set(ids)];
}

function getFacilityIdsCached() {
  // A rejected fetch must not stick around as a cached rejection forever —
  // evict on failure so the next call actually retries instead of replaying
  // the same error (this is what lets the midnight-rollover retry recover).
  if (!idsPromise) idsPromise = getFacilityIds().catch(err => { idsPromise = null; throw err; });
  return idsPromise;
}

// A scheduled GitHub Action pre-fetches today's menus server-side and
// appends a snapshot line to data/<date>.jsonl every ~30 min, so the page
// can render from one fast static request instead of waiting on ETH's API
// (~1s per call) on every visit. Snapshot entries are already in
// {id, name, url, dayEntry} shape, so they need no further processing.
async function getStaticSnapshot(todayStr) {
  try {
    const res = await fetch(`data/${todayStr}.jsonl`);
    if (!res.ok) return null;
    const lines = (await res.text()).split('\n').filter(Boolean);
    if (lines.length === 0) return null;
    return JSON.parse(lines[lines.length - 1]);
  } catch (err) {
    return null;
  }
}

// Facility display order follows each facility's id position in
// websites.txt (food market, FUSION meal, Mendokoro, …) rather than a
// hardcoded list, so this page and stats.html — which reads the same
// generator-emitted order — can't drift apart again. Sorting by id rather
// than name also survives the display name differing by language.
function sortFacilities(entries, ids) {
  const order = new Map(ids.map((id, i) => [id, i]));
  const facilities = entries.filter(Boolean);
  facilities.sort((a, b) => (order.get(a.id) ?? order.size) - (order.get(b.id) ?? order.size));
  return facilities;
}

async function fetchFacilitiesLive(lang, todayStr, tomorrowStr, todayIso, opts) {
  const ids = await getFacilityIdsCached();
  return Promise.all(ids.map(async id => {
    try {
      const [info, rota] = await Promise.all([
        CookpitClient.getFacility(id, lang, opts),
        CookpitClient.getWeeklyRota(id, lang, todayStr, tomorrowStr, opts),
      ]);
      if (!info) return null;
      const dayEntry = findTodayEntry(rota, todayStr, todayIso);
      return { id, name: info['facility-name'] || `Mensa ${id}`, url: info['facility-url'], dayEntry };
    } catch (err) {
      return null;
    }
  }));
}

// Memoized per language *and* Zurich date, so both languages can be fetched
// concurrently at startup, switching the language toggle never needs to wait
// on a fetch, and a tab left open across midnight doesn't keep serving
// yesterday's facilities once the date rolls over (the visibilitychange
// handler in main() forces a fresh render on rollover too).
// Reports whether the static snapshot was used, so the caller can decide to
// double-check against live data in the background.
function getFacilitiesData(lang, todayStr, tomorrowStr, todayIso) {
  const key = `${todayStr}:${lang}`;
  if (!facilitiesPromises[key]) {
    // Same eviction-on-reject as getFacilityIdsCached, and for the same
    // reason: without it a transient failure at the midnight rollover would
    // wedge this date's key as a permanently-cached rejection.
    facilitiesPromises[key] = (async () => {
      const snapshot = await getStaticSnapshot(todayStr);
      const snapshotFacilities = snapshot && snapshot.facilities && snapshot.facilities[lang];
      const entries = snapshotFacilities || await fetchFacilitiesLive(lang, todayStr, tomorrowStr, todayIso);
      const ids = await getFacilityIdsCached();
      return { facilities: sortFacilities(entries, ids), fromSnapshot: Boolean(snapshotFacilities) };
    })().catch(err => { delete facilitiesPromises[key]; throw err; });
  }
  return facilitiesPromises[key];
}

// The static snapshot can be up to ~30 min stale. After the fast initial
// render, quietly re-check against the live API and only touch the DOM if
// something actually changed (e.g. an item sold out since the last run).
async function refreshInBackground(state, token, lang, todayStr, tomorrowStr, todayIso, renderedFacilities) {
  let fresh, ids;
  try {
    // force: true — this check exists specifically to catch things that
    // changed since the snapshot (e.g. a dish selling out), so it must never
    // be answered by the same 5-minute cache the snapshot itself predates.
    ids = await getFacilityIdsCached();
    fresh = sortFacilities(await fetchFacilitiesLive(lang, todayStr, tomorrowStr, todayIso, { force: true }), ids);
  } catch (err) {
    return;
  }
  if (token !== renderToken) return; // superseded by a newer render — discard
  if (JSON.stringify(fresh) === JSON.stringify(renderedFacilities)) return;

  const dishIdLookup = await getDishIdLookupCached();
  // A non-English rating identity must be resolved against English data from
  // this SAME forced-fresh fetch, not buildRatingCtx's memoized
  // getFacilitiesData('en', …) — that one can still hold the older static
  // snapshot, so a counter whose dish changed since the snapshot would have
  // its new name paired with a stale English one and write a rating to the
  // wrong dish id. Fetch English fresh here too; if that fetch fails, still
  // show the refreshed cards, just without rating controls, rather than
  // guess at a pairing.
  let enIdentityMap = null;
  if (lang !== 'en') {
    try {
      const enFresh = sortFacilities(await fetchFacilitiesLive('en', todayStr, tomorrowStr, todayIso, { force: true }), ids);
      enIdentityMap = buildEnIdentityMap(enFresh);
    } catch (err) {
      enIdentityMap = null;
    }
  }
  if (token !== renderToken) return; // superseded while awaiting the above

  const ratingCtx = { lang, strings: STRINGS[lang], dishIdLookup, enIdentityMap };
  renderFacilities(fresh, STRINGS[lang], lang, state.easterEgg, ratingCtx);
  applyView(state);
}

// Picks today's day-of-week entry out of the weekly-rota-array response.
function findTodayEntry(rotaData, todayStr, todayIso) {
  if (!rotaData || !rotaData['weekly-rota-array']) return null;
  for (const rota of rotaData['weekly-rota-array']) {
    if (todayStr < rota['valid-from'] || todayStr > rota['valid-to']) continue;
    const day = (rota['day-of-week-array'] || []).find(d => d['day-of-week-code'] === todayIso);
    if (day) return day;
  }
  return null;
}

function classifyMeal(meal) {
  const classes = (meal['meal-class-array'] || []).map(c => c['desc-short']);
  if (classes.some(c => VEGAN_LABELS.includes(c))) return 'V';
  if (classes.some(c => VEGETARIAN_LABELS.includes(c))) return 'V-';
  return 'O';
}

const SOLD_OUT_LABELS_LC = SOLD_OUT_LABELS.map(s => s.toLowerCase());

// build_stats.py's SOLD_OUT check is case-insensitive; match that here too
// (trim + lowercase at comparison time) instead of assuming the API always
// returns the exact casing in SOLD_OUT_LABELS.
function isSoldOut(meal) {
  return SOLD_OUT_LABELS_LC.includes((meal.name || '').trim().toLowerCase());
}

// Vegan, then vegetarian, then omnivore — except "Choose 5" (build-your-own,
// same name in every language) always sorts after those, and sold-out items
// always sort last of all, below "Choose 5" too.
function mealSortKey(meal) {
  const dietRank = DIET_ORDER[classifyMeal(meal)];
  if (isSoldOut(meal)) return 20 + dietRank;
  if (meal.name === 'Choose 5') return 10 + dietRank;
  return dietRank;
}

function sortedLines(lines) {
  return (lines || [])
    .filter(line => line.meal)
    .sort((a, b) => {
      const rankDiff = mealSortKey(a.meal) - mealSortKey(b.meal);
      return rankDiff !== 0 ? rankDiff : a.meal.name.localeCompare(b.meal.name);
    });
}

// "CHF 8.50 / 12.50 / 15.50 (stud. / int. / ext.)" — using the API's own
// already-localized customer-group labels rather than inventing our own.
function formatPrices(meal) {
  const prices = meal['meal-price-array'] || [];
  if (prices.length === 0) return null;
  const sorted = [...prices].sort((a, b) => a['customer-group-position'] - b['customer-group-position']);
  const amounts = sorted.map(p => p.price.toFixed(2)).join(' / ');
  const labels = sorted.map(p => p['customer-group-desc-short']).join(' / ');
  return `CHF ${amounts} (${labels})`;
}

function el(tag, className, children) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (children) {
    for (const child of Array.isArray(children) ? children : [children]) {
      if (child == null) continue;
      node.append(child.nodeType ? child : document.createTextNode(child));
    }
  }
  return node;
}

// facility is {id, name} for a real dish, or null for the easter-egg card,
// which has no line-id and no legitimate rating identity — the null skips
// the rating widget below rather than rating the joke entry.
function renderMealCard(meal, facility, ratingCtx) {
  const badge = classifyMeal(meal);
  const soldOut = isSoldOut(meal);
  const card = el('div', soldOut ? 'card sold-out' : 'card');

  const imgUrl = CookpitClient.imageUrl(meal);
  if (imgUrl) {
    const img = document.createElement('img');
    img.src = imgUrl;
    img.alt = meal.name || '';
    img.loading = 'lazy';
    if (meal.__containImage) img.classList.add('contain');
    card.append(img);
  }

  const titleRow = el('div', 'card-title-row', [
    el('div', 'card-title', meal.name || ''),
    el('span', `badge badge-${badge}`, badge),
  ]);

  const body = el('div', 'card-body', [
    titleRow,
    meal.description ? el('div', 'card-desc', meal.description) : null,
    formatPrices(meal) ? el('div', 'card-price', formatPrices(meal)) : null,
  ]);

  // No rating for sold-out placeholders — meal.name is the "Sold Out" text
  // itself at that point, not a real dish name to key a rating on. Likewise
  // none when the registry itself is unavailable (dishIdLookup null) —
  // writing under a provisional key here would risk that vote being
  // discarded later by migrateProvisionalRatings once the registry loads.
  if (facility && ratingCtx && ratingCtx.dishIdLookup && !soldOut) {
    const identity = resolveDishIdentity(meal, facility, ratingCtx);
    if (identity) {
      const pairKey = `${identity.facility}|${identity.name}`;
      const dishId = ratingCtx.dishIdLookup.get(pairKey) || `name:${pairKey}`;
      body.append(renderRatingWidget(dishId, ratingCtx.lang, ratingCtx.strings));
    }
  }

  card.append(body);
  return card;
}

function renderFacility(id, name, url, dayEntry, strings, lang, easterEgg, ratingCtx) {
  const section = el('section', 'facility');

  const heading = document.createElement('h2');
  if (url) {
    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = name;
    heading.append(link);
  } else {
    heading.textContent = name;
  }
  section.append(heading);

  if (easterEgg && (name || '').toLowerCase().includes('fusion')) {
    const cards = el('div', 'cards');
    cards.append(renderMealCard({ ...EASTER_EGG_CONTENT[lang], 'meal-class-array': [], __rawImage: EASTER_EGG_IMAGE, __containImage: true }, null, null));
    section.append(cards);
    return section;
  }

  const openingHours = dayEntry && dayEntry['opening-hour-array'];
  if (!openingHours || openingHours.length === 0) {
    section.append(el('div', 'empty-note', strings.noMenuToday));
    return section;
  }

  const facility = { id, name };
  for (const oh of openingHours) {
    for (const mealTime of oh['meal-time-array'] || []) {
      section.append(el('div', 'meal-time-label', mealTime.name));
      const cards = el('div', 'cards');
      for (const line of sortedLines(mealTime['line-array'])) {
        cards.append(renderMealCard(line.meal, facility, ratingCtx));
      }
      section.append(cards);
    }
  }

  return section;
}

function renderFacilities(facilities, strings, lang, easterEgg, ratingCtx) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (facilities.length === 0) {
    app.append(el('div', 'error-note', strings.noFacilities));
    return;
  }
  for (const f of facilities) {
    app.append(renderFacility(f.id, f.name, f.url, f.dayEntry, strings, lang, easterEgg, ratingCtx));
  }
}

function applyView(state) {
  document.getElementById('app').classList.toggle('list-view', state.view === 'list');
}

function updateToggleButtons(state) {
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
}

// A monotonic render token guards against a stale response painting over a
// newer one — two quick language switches can let the first request's fetch
// resolve after the second's, so only the *last* loadAndRender call may
// touch the DOM once its await returns.
async function loadAndRender(state) {
  const token = ++renderToken;
  const lang = state.lang;
  const strings = STRINGS[lang];
  const app = document.getElementById('app');
  document.documentElement.lang = lang;
  document.title = strings.title;
  document.getElementById('titleText').textContent = strings.title;
  document.getElementById('ratingNote').textContent = strings.ratingNote;

  const { now, todayStr, tomorrowStr, todayIso } = zurichDateContext();
  document.getElementById('dateLine').textContent =
    now.toLocaleDateString(strings.dateLocale, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Europe/Zurich' });

  app.innerHTML = '';
  app.append(el('div', 'loading', strings.loading));

  let facilities, fromSnapshot, ratingCtx;
  try {
    [{ facilities, fromSnapshot }, ratingCtx] = await Promise.all([
      getFacilitiesData(lang, todayStr, tomorrowStr, todayIso),
      buildRatingCtx(lang, strings, todayStr, tomorrowStr, todayIso),
    ]);
  } catch (err) {
    if (token !== renderToken) return; // superseded by a newer render — discard
    app.innerHTML = '';
    app.append(el('div', 'error-note', strings.loadError));
    return;
  }
  if (token !== renderToken) return; // superseded by a newer render — discard

  // Only mark this date as rendered once the DOM commit is actually going
  // to happen — the error path above returns without reaching here, so a
  // later visibilitychange still sees a stale renderedDateStr and retries.
  renderedDateStr = todayStr;

  renderFacilities(facilities, strings, lang, state.easterEgg, ratingCtx);
  applyView(state);

  if (fromSnapshot) {
    refreshInBackground(state, token, lang, todayStr, tomorrowStr, todayIso, facilities);
  }
}

function main() {
  const state = getStateFromUrl();
  updateUrl(state);
  updateToggleButtons(state);
  applyView(state);
  updateStatsLink(state);
  loadAndRender(state);

  // Fetch the other language in the background too, so toggling never waits on a fetch.
  const { todayStr, tomorrowStr, todayIso } = zurichDateContext();
  const otherLang = state.lang === 'en' ? 'de' : 'en';
  getFacilitiesData(otherLang, todayStr, tomorrowStr, todayIso).catch(() => {});

  document.querySelectorAll('[data-lang]').forEach(btn => btn.addEventListener('click', () => {
    if (state.lang === btn.dataset.lang) return;
    state.lang = btn.dataset.lang;
    updateUrl(state);
    updateToggleButtons(state);
    updateStatsLink(state);
    loadAndRender(state);
  }));

  document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => {
    if (state.view === btn.dataset.view) return;
    state.view = btn.dataset.view;
    updateUrl(state);
    updateToggleButtons(state);
    applyView(state);
  }));

  // A tab left open across a Zurich midnight would otherwise keep showing
  // the previous day's menu until something else happened to trigger a
  // render; catch that as soon as the tab is brought back into focus.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (zurichDateContext().todayStr !== renderedDateStr) loadAndRender(state);
  });
}

main();
</script>
</body>
</html>
