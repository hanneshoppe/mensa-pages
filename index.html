<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensa Menus</title>
<style>
  :root {
    --bg: #f7f5f2;
    --card-bg: #ffffff;
    --text: #1f2320;
    --muted: #6b7168;
    --border: #e4e0da;
    --accent: #2f5233;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 28px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
  }
  .date-line {
    color: var(--muted);
    font-size: 0.95rem;
  }
  .controls {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .toggle-group {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .toggle-btn {
    border: none;
    background: var(--card-bg);
    color: var(--text);
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .toggle-btn + .toggle-btn {
    border-left: 1px solid var(--border);
  }
  .toggle-btn.active {
    background: var(--accent);
    color: #fff;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  section.facility h2 {
    margin: 0 0 2px;
    font-size: 1.25rem;
  }
  section.facility h2 a {
    color: var(--text);
    text-decoration: none;
  }
  section.facility h2 a:hover {
    text-decoration: underline;
  }
  .meal-time-label {
    color: var(--muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 14px 0 8px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card.sold-out {
    opacity: 0.55;
    filter: grayscale(70%);
  }
  .card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: var(--border);
    display: block;
  }
  .card img.contain {
    object-fit: contain;
  }
  .card-body {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .card-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .card-title {
    font-weight: 600;
    font-size: 0.98rem;
    line-height: 1.25;
  }
  .badge {
    flex-shrink: 0;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    color: #fff;
    white-space: nowrap;
  }
  .badge-O { background: #a35d3a; }
  .badge-V- { background: #7ea364; }
  .badge-V { background: #3f7d3f; }
  .card-desc {
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.35;
    white-space: pre-line;
  }
  .card-price {
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    margin-top: 2px;
  }
  .empty-note, .error-note {
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
  }
  .error-note { color: #a33; }
  .loading {
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
  }

  /* List view: same markup, row layout instead of a card grid */
  #app.list-view .cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #app.list-view .card {
    flex-direction: row;
    align-items: center;
  }
  #app.list-view .card img {
    width: 64px;
    align-self: stretch;
    flex-shrink: 0;
  }
  #app.list-view .card-body {
    padding: 8px 12px;
    flex: 1;
    min-width: 0;
  }
  #app.list-view .card-desc {
    white-space: normal;
  }
</style>
</head>
<body>
<header>
  <h1 id="titleText">Mensa Menus</h1>
  <div class="date-line" id="dateLine"></div>
  <div class="controls">
    <div class="toggle-group" role="group" aria-label="Language">
      <button type="button" class="toggle-btn" data-lang="de">DE</button>
      <button type="button" class="toggle-btn" data-lang="en">EN</button>
    </div>
    <div class="toggle-group" role="group" aria-label="View">
      <button type="button" class="toggle-btn" data-view="cards">Cards</button>
      <button type="button" class="toggle-btn" data-view="list">List</button>
    </div>
  </div>
</header>
<main id="app">
  <div class="loading">Loading…</div>
</main>

<script>
// Client for ETH's public Cookpit menu API (the same one ethz.ch's own menu
// pages call). Responses are cached in localStorage since the API sends no
// Cache-Control/ETag of its own.
const CookpitClient = (() => {
  const BASE_URL = 'https://idapps.ethz.ch/cookpit-pub-services/v1/';
  const CLIENT_ID = 'ethz-wcms';
  const CACHE_TTL_MS = 5 * 60 * 1000;

  function cacheGet(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const { timestamp, data } = JSON.parse(raw);
      if (Date.now() - timestamp > CACHE_TTL_MS) return null;
      return data;
    } catch (err) {
      return null;
    }
  }

  function cacheSet(key, data) {
    try {
      localStorage.setItem(key, JSON.stringify({ timestamp: Date.now(), data }));
    } catch (err) {
      // Storage unavailable (private browsing, quota, …) — just skip caching.
    }
  }

  async function getJson(url, cacheKey) {
    const cached = cacheGet(cacheKey);
    if (cached) return cached;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    cacheSet(cacheKey, data);
    return data;
  }

  function getFacility(id, lang) {
    const url = `${BASE_URL}facilities/${id}?client-id=${CLIENT_ID}&lang=${lang}`;
    return getJson(url, `mensa:facility:${id}:${lang}`);
  }

  function getWeeklyRota(id, lang, validAfter, validBefore) {
    const url = `${BASE_URL}weeklyrotas?client-id=${CLIENT_ID}&lang=${lang}&rs-first=0&rs-size=50` +
      `&valid-after=${validAfter}&valid-before=${validBefore}&facility=${id}`;
    return getJson(url, `mensa:rota:${id}:${lang}:${validAfter}`);
  }

  function imageUrl(meal) {
    if (meal.__rawImage) return meal.__rawImage;
    if (!meal['image-url']) return null;
    return `${meal['image-url']}?client-id=${CLIENT_ID}`;
  }

  return { getFacility, getWeeklyRota, imageUrl };
})();

// Facilities we prioritize first, matched case-insensitively against facility-name.
const PRIORITY_ORDER = ['food market', 'fusion'];

const VEGAN_LABELS = ['Vegan'];
const VEGETARIAN_LABELS = ['Vegetarisch', 'Vegetarian'];
const SOLD_OUT_LABELS = ['Ausverkauft', 'Sold Out'];
const DIET_ORDER = { V: 0, 'V-': 1, O: 2 };

// Hidden easter egg for FUSION, enabled via ?ea=1.
const EASTER_EGG_IMAGE = 'https://cdn.creazilla.com/cliparts/60279/sad-face-clipart-md.png';
const EASTER_EGG_CONTENT = {
  de: { name: 'Nichts Gutes', description: 'hier gehen Träume und Ziele zum sterben hin' },
  en: { name: 'Nothing Good', description: 'dying hopes and dreams' },
};

const STRINGS = {
  de: {
    title: 'Mensa Menüs',
    loading: 'Lade Menüs…',
    noMenuToday: 'Heute keine Menüs verfügbar.',
    loadError: 'Konnte websites.txt nicht laden.',
    noFacilities: 'Keine Mensen gefunden.',
    dateLocale: 'de-CH',
  },
  en: {
    title: 'Mensa Menus',
    loading: 'Loading menus…',
    noMenuToday: 'No menus available today.',
    loadError: 'Could not load websites.txt.',
    noFacilities: 'No canteens found.',
    dateLocale: 'en-GB',
  },
};

const facilitiesPromises = {}; // lang -> Promise<facilities array>
let idsPromise = null;

function pad(n) { return String(n).padStart(2, '0'); }

function formatDate(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// ISO weekday: Monday=1 ... Sunday=7, matching the API's day-of-week-code.
function isoWeekday(d) {
  return ((d.getDay() + 6) % 7) + 1;
}

function getStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const lang = params.get('lang') === 'de' ? 'de' : 'en';
  const view = params.get('view') === 'list' ? 'list' : 'cards';
  const easterEgg = params.get('ea') === '1';
  return { lang, view, easterEgg };
}

function updateUrl(state) {
  const params = new URLSearchParams(window.location.search);
  params.set('lang', state.lang);
  params.set('view', state.view);
  history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
}

async function getFacilityIds() {
  const res = await fetch('websites.txt');
  const text = await res.text();
  const ids = [...text.matchAll(/[?&]id=(\d+)/g)].map(m => m[1]);
  return [...new Set(ids)];
}

function getFacilityIdsCached() {
  if (!idsPromise) idsPromise = getFacilityIds();
  return idsPromise;
}

// Memoized per language, so both languages can be fetched concurrently at
// startup and switching the language toggle never needs to wait on a fetch.
function getFacilitiesData(lang, todayStr, tomorrowStr, todayIso) {
  if (!facilitiesPromises[lang]) {
    facilitiesPromises[lang] = (async () => {
      const ids = await getFacilityIdsCached();
      const results = await Promise.all(ids.map(async id => {
        try {
          const [info, rota] = await Promise.all([
            CookpitClient.getFacility(id, lang),
            CookpitClient.getWeeklyRota(id, lang, todayStr, tomorrowStr),
          ]);
          if (!info) return null;
          const dayEntry = findTodayEntry(rota, todayStr, todayIso);
          return { id, name: info['facility-name'] || `Mensa ${id}`, url: info['facility-url'], dayEntry };
        } catch (err) {
          return null;
        }
      }));
      const facilities = results.filter(Boolean);
      facilities.sort((a, b) => facilityPriority(a.name) - facilityPriority(b.name));
      return facilities;
    })();
  }
  return facilitiesPromises[lang];
}

// Picks today's day-of-week entry out of the weekly-rota-array response.
function findTodayEntry(rotaData, todayStr, todayIso) {
  if (!rotaData || !rotaData['weekly-rota-array']) return null;
  for (const rota of rotaData['weekly-rota-array']) {
    if (todayStr < rota['valid-from'] || todayStr > rota['valid-to']) continue;
    const day = (rota['day-of-week-array'] || []).find(d => d['day-of-week-code'] === todayIso);
    if (day) return day;
  }
  return null;
}

function classifyMeal(meal) {
  const classes = (meal['meal-class-array'] || []).map(c => c['desc-short']);
  if (classes.some(c => VEGAN_LABELS.includes(c))) return 'V';
  if (classes.some(c => VEGETARIAN_LABELS.includes(c))) return 'V-';
  return 'O';
}

// Vegan, then vegetarian, then omnivore — except "Choose 5" (build-your-own,
// same name in every language) always sorts after those, and sold-out items
// always sort last of all, below "Choose 5" too.
function mealSortKey(meal) {
  const dietRank = DIET_ORDER[classifyMeal(meal)];
  if (SOLD_OUT_LABELS.includes(meal.name)) return 20 + dietRank;
  if (meal.name === 'Choose 5') return 10 + dietRank;
  return dietRank;
}

function sortedLines(lines) {
  return (lines || [])
    .filter(line => line.meal)
    .sort((a, b) => {
      const rankDiff = mealSortKey(a.meal) - mealSortKey(b.meal);
      return rankDiff !== 0 ? rankDiff : a.meal.name.localeCompare(b.meal.name);
    });
}

// "CHF 8.50 / 12.50 / 15.50 (stud. / int. / ext.)" — using the API's own
// already-localized customer-group labels rather than inventing our own.
function formatPrices(meal) {
  const prices = meal['meal-price-array'] || [];
  if (prices.length === 0) return null;
  const sorted = [...prices].sort((a, b) => a['customer-group-position'] - b['customer-group-position']);
  const amounts = sorted.map(p => p.price.toFixed(2)).join(' / ');
  const labels = sorted.map(p => p['customer-group-desc-short']).join(' / ');
  return `CHF ${amounts} (${labels})`;
}

function el(tag, className, children) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (children) {
    for (const child of Array.isArray(children) ? children : [children]) {
      if (child == null) continue;
      node.append(child.nodeType ? child : document.createTextNode(child));
    }
  }
  return node;
}

function renderMealCard(meal) {
  const badge = classifyMeal(meal);
  const soldOut = SOLD_OUT_LABELS.includes(meal.name);
  const card = el('div', soldOut ? 'card sold-out' : 'card');

  const imgUrl = CookpitClient.imageUrl(meal);
  if (imgUrl) {
    const img = document.createElement('img');
    img.src = imgUrl;
    img.alt = meal.name || '';
    img.loading = 'lazy';
    if (meal.__containImage) img.classList.add('contain');
    card.append(img);
  }

  const titleRow = el('div', 'card-title-row', [
    el('div', 'card-title', meal.name || ''),
    el('span', `badge badge-${badge}`, badge),
  ]);

  const body = el('div', 'card-body', [
    titleRow,
    meal.description ? el('div', 'card-desc', meal.description) : null,
    formatPrices(meal) ? el('div', 'card-price', formatPrices(meal)) : null,
  ]);

  card.append(body);
  return card;
}

function renderFacility(name, url, dayEntry, strings, lang, easterEgg) {
  const section = el('section', 'facility');

  const heading = document.createElement('h2');
  if (url) {
    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = name;
    heading.append(link);
  } else {
    heading.textContent = name;
  }
  section.append(heading);

  if (easterEgg && (name || '').toLowerCase().includes('fusion')) {
    const cards = el('div', 'cards');
    cards.append(renderMealCard({ ...EASTER_EGG_CONTENT[lang], 'meal-class-array': [], __rawImage: EASTER_EGG_IMAGE, __containImage: true }));
    section.append(cards);
    return section;
  }

  const openingHours = dayEntry && dayEntry['opening-hour-array'];
  if (!openingHours || openingHours.length === 0) {
    section.append(el('div', 'empty-note', strings.noMenuToday));
    return section;
  }

  for (const oh of openingHours) {
    for (const mealTime of oh['meal-time-array'] || []) {
      section.append(el('div', 'meal-time-label', mealTime.name));
      const cards = el('div', 'cards');
      for (const line of sortedLines(mealTime['line-array'])) {
        cards.append(renderMealCard(line.meal));
      }
      section.append(cards);
    }
  }

  return section;
}

function facilityPriority(name) {
  const lower = (name || '').toLowerCase();
  const idx = PRIORITY_ORDER.findIndex(p => lower.includes(p));
  return idx === -1 ? PRIORITY_ORDER.length : idx;
}

function renderFacilities(facilities, strings, lang, easterEgg) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (facilities.length === 0) {
    app.append(el('div', 'error-note', strings.noFacilities));
    return;
  }
  for (const f of facilities) {
    app.append(renderFacility(f.name, f.url, f.dayEntry, strings, lang, easterEgg));
  }
}

function applyView(state) {
  document.getElementById('app').classList.toggle('list-view', state.view === 'list');
}

function updateToggleButtons(state) {
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
}

async function loadAndRender(state) {
  const strings = STRINGS[state.lang];
  const app = document.getElementById('app');
  document.documentElement.lang = state.lang;
  document.title = strings.title;
  document.getElementById('titleText').textContent = strings.title;

  const today = new Date();
  document.getElementById('dateLine').textContent =
    today.toLocaleDateString(strings.dateLocale, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  app.innerHTML = '';
  app.append(el('div', 'loading', strings.loading));

  const tomorrow = new Date(today.getTime() + 24 * 60 * 60 * 1000);
  const todayStr = formatDate(today);
  const tomorrowStr = formatDate(tomorrow);
  const todayIso = isoWeekday(today);

  let facilities;
  try {
    facilities = await getFacilitiesData(state.lang, todayStr, tomorrowStr, todayIso);
  } catch (err) {
    app.innerHTML = '';
    app.append(el('div', 'error-note', strings.loadError));
    return;
  }

  renderFacilities(facilities, strings, state.lang, state.easterEgg);
  applyView(state);
}

function main() {
  const state = getStateFromUrl();
  updateUrl(state);
  updateToggleButtons(state);
  applyView(state);
  loadAndRender(state);

  // Fetch the other language in the background too, so toggling never waits on a fetch.
  const today = new Date();
  const tomorrow = new Date(today.getTime() + 24 * 60 * 60 * 1000);
  const otherLang = state.lang === 'en' ? 'de' : 'en';
  getFacilitiesData(otherLang, formatDate(today), formatDate(tomorrow), isoWeekday(today)).catch(() => {});

  document.querySelectorAll('[data-lang]').forEach(btn => btn.addEventListener('click', () => {
    if (state.lang === btn.dataset.lang) return;
    state.lang = btn.dataset.lang;
    updateUrl(state);
    updateToggleButtons(state);
    loadAndRender(state);
  }));

  document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => {
    if (state.view === btn.dataset.view) return;
    state.view = btn.dataset.view;
    updateUrl(state);
    updateToggleButtons(state);
    applyView(state);
  }));
}

main();
</script>
</body>
</html>
