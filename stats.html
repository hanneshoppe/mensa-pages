<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensa Stats</title>
<style>
  :root {
    --bg: #f7f5f2;
    --card-bg: #ffffff;
    --text: #1f2320;
    --muted: #6b7168;
    --border: #e4e0da;
    --accent: #2f5233;
    /* Categorical series slots — validated (fixed hue order, CVD-safe adjacent
       pairs, ≥3:1 contrast except s4/s5 which rely on the text-color-label
       relief rule below). Never reassign a slot by rank or cycle it. */
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --s5: #e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19;
      --card-bg: #242422;
      --text: #ffffff;
      --muted: #c3c2b7;
      --border: #3a3a37;
      --accent: #3f6b45;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --s5: #d55181;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 28px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
  }
  .date-line {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .back-link {
    color: var(--muted);
    font-size: 0.85rem;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .toggle-group {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .toggle-btn {
    border: none;
    background: var(--card-bg);
    color: var(--text);
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .toggle-btn + .toggle-btn {
    border-left: 1px solid var(--border);
  }
  .toggle-btn.active {
    background: var(--accent);
    color: #fff;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  .loading, .empty-note, .error-note {
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
  }
  .empty-note { font-style: italic; text-align: left; padding: 8px 0; }
  .error-note { color: #a33; }

  section.stat-section h2 {
    margin: 0 0 6px;
    font-size: 1.25rem;
  }
  .section-note {
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.4;
    margin: 0 0 16px;
    max-width: 70ch;
  }

  /* Shared legend, reused by the diet-mix and price-spread sections. */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin: 10px 0 16px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* Buttons — same visual language as index.html's .toggle-btn. */
  .btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 5px 12px;
    font-size: 0.82rem;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }

  /* --- Diet mix --- */
  .diet-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 5px 0;
  }
  .diet-row.overall {
    border-top: 1px solid var(--border);
    margin-top: 6px;
    padding-top: 13px;
    font-weight: 600;
  }
  .diet-row-label {
    width: 140px;
    flex-shrink: 0;
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .diet-bar {
    flex: 1;
    min-width: 0;
    display: flex;
    gap: 2px;
    height: 28px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--border);
  }
  .diet-seg {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 2px;
    overflow: hidden;
  }
  .diet-seg-label {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    padding: 0 4px;
    pointer-events: none;
  }
  .diet-row-total {
    width: 64px;
    flex-shrink: 0;
    text-align: right;
    font-size: 0.78rem;
    color: var(--muted);
  }
  /* Shown next to a facility's name wherever its coverage is narrower than
     the overall date range (e.g. a canteen that opened partway through). */
  .coverage-note { color: var(--muted); font-weight: 400; font-size: 0.78em; }
  @media (max-width: 480px) {
    .diet-row { flex-wrap: wrap; }
    .diet-row-label { width: 100%; }
    .diet-row-total { width: auto; margin-left: auto; }
  }

  table.data-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.82rem;
  }
  table.data-table th, table.data-table td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.data-table th { color: var(--muted); font-weight: 600; }
  .table-wrap { overflow-x: auto; }

  /* --- Price spread --- */
  .price-axis-caption {
    color: var(--muted);
    font-size: 0.78rem;
    margin-bottom: 2px;
  }
  .price-grid {
    display: grid;
    grid-template-columns: 84px 1fr;
    column-gap: 12px;
    align-items: center;
  }
  .price-axis-row { margin-bottom: 8px; }
  .price-axis-svg { width: 100%; height: 20px; display: block; overflow: visible; }
  .price-axis-tick-label {
    position: absolute;
    top: 6px;
    font-size: 0.7rem;
    color: var(--muted);
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .price-axis-ticks { position: relative; height: 14px; }
  .price-facility { margin-bottom: 14px; }
  .price-facility h3 {
    margin: 0 0 6px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .price-group-label {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .price-mark-wrap {
    position: relative;
    height: 30px;
  }
  .price-row-svg { width: 100%; height: 26px; display: block; overflow: visible; }
  .price-median-label {
    position: absolute;
    top: -13px;
    transform: translateX(-50%);
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    pointer-events: none;
  }
  .price-median-label.edge-start { transform: translateX(0); }
  .price-median-label.edge-end { transform: translateX(-100%); }

  /* --- Tooltip (shared by diet segments and price marks) --- */
  #tooltip {
    position: fixed;
    z-index: 50;
    background: var(--text);
    color: var(--bg);
    font-size: 0.78rem;
    line-height: 1.4;
    padding: 6px 10px;
    border-radius: 6px;
    pointer-events: none;
    max-width: 240px;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.08s;
  }
  #tooltip.visible { visibility: visible; opacity: 1; }
  #tooltip .tt-strong { font-weight: 700; }

  /* --- Dish ledger --- */
  .ledger-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
    font-size: 0.85rem;
  }
  .ledger-controls select,
  .ledger-controls input[type="text"] {
    font-size: 0.82rem;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
  }
  .ledger-controls input[type="text"] { min-width: 160px; }
  .column-chooser {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 14px;
    margin-bottom: 12px;
    font-size: 0.82rem;
  }
  .column-chooser-label { color: var(--muted); }
  .column-chooser label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th.sortable .sort-arrow { color: var(--accent); }
  .diet-badge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .diet-badge-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .muted-dash { color: var(--muted); }

  /* --- Today --- */
  .today-facility { margin-bottom: 24px; }
  .today-facility:last-child { margin-bottom: 0; }
  .today-facility h3 { margin: 0 0 6px; font-size: 0.95rem; font-weight: 600; }
  .today-facility .diet-row { padding: 3px 0; }
  .today-facility .table-wrap { margin-top: 10px; }

  /* --- Counters --- */
  .counter-block {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    margin-bottom: 8px;
  }
  .counter-block summary { cursor: pointer; font-weight: 600; font-size: 0.88rem; padding: 4px 0; }
  .counter-block summary:hover { color: var(--accent); }
  .counter-dish-list { list-style: none; margin: 6px 0 4px; padding: 0; font-size: 0.84rem; }
  .counter-dish-list li { padding: 5px 0; border-top: 1px solid var(--border); }
  .counter-dish-list li:first-child { border-top: none; }
  .variant-badge { color: var(--muted); font-size: 0.85em; }
</style>
</head>

// Same tiny DOM-builder pattern as index.html: el() for HTML nodes. svgEl()
// is its SVG-namespace counterpart, needed because SVG tags can't be made
// with document.createElement.
function el(tag, className, children) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (children) {
    for (const child of Array.isArray(children) ? children : [children]) {
      if (child == null) continue;
      node.append(child.nodeType ? child : document.createTextNode(child));
    }
  }
  return node;
}

const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, children) {
  const node = document.createElementNS(SVG_NS, tag);
  if (attrs) for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (children) for (const child of Array.isArray(children) ? children : [children]) {
    if (child != null) node.append(child);
  }
  return node;
}

// anything the API adds later is unknown and gets appended (first-seen) after

// Union of customer-group keys actually present in the data (facilities +
// overall), ordered as: known groups first (filtered to those present), then
// any unknown groups in first-seen order. Computed once per render so the
// legend, axis domain, and per-facility rows all agree on the same order.
function computePriceGroups(stats) {
  const seen = new Set();
  const firstSeenOrder = [];
  for (const prices of [...stats.facilities.map(f => f.prices), stats.overall.prices]) {
    if (!prices) continue;
    for (const k of Object.keys(prices)) {
      if (!seen.has(k)) { seen.add(k); firstSeenOrder.push(k); }
    }
  }
  const known = PRICE_GROUPS_KNOWN.filter(g => seen.has(g));
  const unknown = firstSeenOrder.filter(g => !PRICE_GROUPS_KNOWN.includes(g));
  return [...known, ...unknown];
}

// Color + label lookups keyed to one groups list, so a color slot is always
// assigned by index into that list — never cycled — and past slot 5 falls
// back to a neutral color (the direct label + legend still carry identity).
function priceGroupMaps(groups, strings) {
  const colorVars = {}, labels = {};
  groups.forEach((g, i) => {
    colorVars[g] = i < COLOR_SLOTS.length ? COLOR_SLOTS[i] : '--muted';
    labels[g] = strings.priceGroups[g] || g;
  });
  return { colorVars, labels };
}

function displayName(f, strings) { return f.name === 'all' ? strings.allFacilities : f.name; }

// A facility that joined (or left) partway through the archive has a
// firstSeen/lastSeen narrower than the overall date range — surface that so
// it doesn't read as equivalent to a facility with full coverage.
function coverageNote(f, dateRange, strings) {
  if (f.firstSeen === dateRange.from && f.lastSeen === dateRange.to) return null;
  return `${f.days} ${strings.daysUnit} · ${f.firstSeen}→${f.lastSeen}`;
}

// Choose 5's contribution to a facility's (or the overall's) diet counts and
// dish-day total, subtracted out so the diet-mix section can exclude it from
// the ledger while still summing to 100% — the numerator and denominator
// both shrink by the same amount. Returns adjusted copies; never mutates the
// stats object other sections still read unfiltered.
function dietStatsExcludingChoose5(stats) {
  const choose5ByFacility = new Map();
  for (const d of stats.dishes) {
    if (d.name === CHOOSE_5_NAME) choose5ByFacility.set(d.facility, d);
  }
  if (choose5ByFacility.size === 0) return { facilities: stats.facilities, overall: stats.overall };

  // entry.dietDays is the dish's own per-diet histogram (each day counted
  // under *that day's* classification), so subtract it bucket-by-bucket.
  // entry.diet is only the dish's *latest* classification — subtracting the
  // whole count from that single bucket is wrong whenever the tag changed
  // over the dish's history, so it's kept only as a fallback for an older
  // stats.json that predates dietDays. Either way, clamp each bucket at
  // zero (upstream data bug otherwise going negative) and shrink dishDays
  // by exactly what was actually removed, so numerator and denominator
  // stay in lockstep and percentages keep summing correctly.
  function subtract(f, entry) {
    const diet = { ...f.diet };
    let removed = 0;
    if (entry.dietDays) {
      for (const k of DIET_KEYS) {
        const take = Math.min(diet[k], entry.dietDays[k] || 0);
        diet[k] -= take;
        removed += take;
      }
    } else {
      const take = Math.min(diet[entry.diet], entry.count);
      diet[entry.diet] -= take;
      removed = take;
    }
    return { ...f, diet, dishDays: f.dishDays - removed };
  }
  const facilities = stats.facilities.map(f => {
    const entry = choose5ByFacility.get(f.name);
    return entry ? subtract(f, entry) : f;
  });
  let overall = stats.overall;
  for (const entry of choose5ByFacility.values()) overall = subtract(overall, entry);
  return { facilities, overall };
}

// ---- tooltip (shared hover/focus layer for diet segments + price marks) ----
const tooltipEl = document.getElementById('tooltip');

function showTooltip(x, y, lines) {
  tooltipEl.innerHTML = '';
  for (const line of lines) {
    tooltipEl.append(el('div', line.strong ? 'tt-strong' : null, line.text));
  }
  tooltipEl.classList.add('visible');
  // Position first, then clamp against the viewport so it never clips off
  // the container edge (a chart near the right/bottom edge of the page).
  tooltipEl.style.left = `${x}px`;
  tooltipEl.style.top = `${y}px`;
  const rect = tooltipEl.getBoundingClientRect();
  let left = x + 12, top = y + 12;
  if (left + rect.width > window.innerWidth - 8) left = x - rect.width - 12;
  if (top + rect.height > window.innerHeight - 8) top = y - rect.height - 12;
  tooltipEl.style.left = `${Math.max(4, left)}px`;
  tooltipEl.style.top = `${Math.max(4, top)}px`;
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
}

// Wires pointer + keyboard-focus hover to a shared tooltip, so mouse and
// keyboard users get the same detail (interaction.md: "same on focus as hover").
function attachTooltip(node, linesFn) {
  node.addEventListener('pointermove', e => showTooltip(e.clientX, e.clientY, linesFn()));
  node.addEventListener('pointerleave', hideTooltip);
  node.addEventListener('focus', () => {
    const rect = node.getBoundingClientRect();
    showTooltip(rect.left, rect.bottom, linesFn());
  });
  node.addEventListener('blur', hideTooltip);
}

function renderLegend(keys, labelMap, colorVarMap) {
  const legend = el('div', 'legend');
  for (const k of keys) {
    const swatch = el('span', 'legend-swatch');
    swatch.style.background = `var(${colorVarMap[k]})`;
    legend.append(el('div', 'legend-item', [swatch, labelMap[k]]));
  }
  return legend;
}

// ---------------------------------------------------------------------------
// Section 1 — diet mix: a horizontal stacked bar per facility (+ one for the
// combined "overall" row), part-to-whole composition of vegan/vegetarian/
// fish/meat/unclassified dish-days.
// ---------------------------------------------------------------------------

// Largest-remainder apportionment: round each share down, then hand the
// leftover points to the segments with the biggest fractional remainder,
// so the printed integers always sum to exactly 100 (independent rounding
// otherwise drifts a point off, e.g. 16+29+5+45+6 = 101).
function apportionPercentages(counts, total) {
  if (!total) return counts.map(() => 0);
  const exact = counts.map(c => c / total * 100);
  const floors = exact.map(Math.floor);
  const leftover = 100 - floors.reduce((a, b) => a + b, 0);
  const byRemainder = exact
    .map((v, i) => ({ i, frac: v - floors[i] }))
    .sort((a, b) => b.frac - a.frac);
  const result = floors.slice();
  for (let k = 0; k < leftover; k++) result[byRemainder[k].i]++;
  return result;
}

function dietRow(f, isOverall, dateRange, strings) {
  const total = f.dishDays;
  const dishesWord = strings.dishesUnit;
  const ofWord = strings.ofWord;
  const pcts = apportionPercentages(DIET_KEYS.map(k => f.diet[k]), total);
  const bar = el('div', 'diet-bar');
  bar.setAttribute('role', 'img');
  bar.setAttribute('aria-label',
    `${displayName(f, strings)} — ${strings.dietSectionTitle}: ` +
    DIET_KEYS.map(k => `${strings.diet[k]} ${f.diet[k]}`).join(', '));

  DIET_KEYS.forEach((k, i) => {
    const count = f.diet[k];
    if (count <= 0) return;
    const pct = total ? (count / total * 100) : 0;
    const seg = el('div', 'diet-seg');
    seg.style.flexGrow = count;
    seg.style.background = `var(${DIET_COLOR_VAR[k]})`;
    seg.tabIndex = 0;
    seg.setAttribute('aria-label', `${strings.diet[k]}: ${count} ${dishesWord}, ${pct.toFixed(1)}%`);
    seg.append(el('span', 'diet-seg-label', `${count} (${pcts[i]}%)`));
    attachTooltip(seg, () => [
      { text: strings.diet[k] },
      { text: `${count} ${dishesWord} · ${pct.toFixed(1)}% ${ofWord} ${displayName(f, strings)}`, strong: true },
    ]);
    bar.append(seg);
  });

  const cov = coverageNote(f, dateRange, strings);
  const label = el('div', 'diet-row-label', displayName(f, strings));
  if (cov) label.append(el('span', 'coverage-note', ` · ${cov}`));

  return el('div', isOverall ? 'diet-row overall' : 'diet-row', [
    label,
    bar,
    el('div', 'diet-row-total', `${total}`),
  ]);
}

// Direct labels are mandatory, but a label wider than its own segment must
// not be clipped (marks-and-anatomy.md) — hide it and let the tooltip/legend/
// table carry the value instead. Needs actual layout, so it runs post-render.
function fitDietLabels(container) {
  container.querySelectorAll('.diet-seg').forEach(seg => {
    const label = seg.querySelector('.diet-seg-label');
    if (!label) return;
    label.style.display = '';
    label.hidden = label.scrollWidth + 6 > seg.clientWidth;
  });
}

function dietTable(rows, strings) {
  const headCells = [strings.colFacility, strings.colDays, strings.colDishes, ...DIET_KEYS.map(k => strings.diet[k])];
  const thead = el('thead', null, el('tr', null, headCells.map(h => el('th', null, h))));
  const tbody = el('tbody');
  for (const f of rows) {
    const total = f.dishDays;
    const pcts = apportionPercentages(DIET_KEYS.map(k => f.diet[k]), total);
    tbody.append(el('tr', null, [
      el('td', null, displayName(f, strings)),
      el('td', null, String(f.days)),
      el('td', null, String(total)),
      ...DIET_KEYS.map((k, i) => el('td', null, `${f.diet[k]} (${pcts[i]}%)`)),
    ]));
  }
  const table = el('table', 'data-table', [thead, tbody]);
  return el('div', 'table-wrap', table);
}

// state.dietTableVisible persists the show/hide toggle across a language
// re-render; state.lang picks the strings.
function renderDietSection(stats, state) {
  const strings = STRINGS[state.lang];
  const { facilities, overall } = dietStatsExcludingChoose5(stats);

  const section = el('section', 'stat-section');
  section.append(el('h2', null, strings.dietSectionTitle));
  section.append(el('p', 'section-note', strings.dietSectionNote));
  section.append(renderLegend(DIET_KEYS, strings.diet, DIET_COLOR_VAR));

  const rows = [...facilities, overall];
  if (rows.every(f => f.dishDays === 0)) {
    section.append(el('div', 'empty-note', strings.dietEmptyNote));
    return section;
  }
  for (const f of facilities) section.append(dietRow(f, false, stats.dateRange, strings));
  section.append(dietRow(overall, true, stats.dateRange, strings));

  const tableBox = el('div', null, dietTable(rows, strings));
  tableBox.hidden = !state.dietTableVisible;
  const toggle = el('button', 'btn', state.dietTableVisible ? strings.hideTable : strings.showTable);
  toggle.type = 'button';
  toggle.addEventListener('click', () => {
    state.dietTableVisible = !state.dietTableVisible;
    tableBox.hidden = !state.dietTableVisible;
    toggle.textContent = state.dietTableVisible ? strings.hideTable : strings.showTable;
  });
  const toggleWrap = el('div', null, toggle);
  toggleWrap.style.marginTop = '12px';
  section.append(toggleWrap, tableBox);
  return section;
}

// ---------------------------------------------------------------------------
// Section 2 — price spread: one box-plot-style range mark per customer group,
// per facility, all sharing one x-scale so facilities stay comparable.
// ---------------------------------------------------------------------------

function computePriceDomain(facilities, groups) {
  let min = Infinity, max = -Infinity;
  for (const f of facilities) {
    for (const g of groups) {
      const p = f.prices && f.prices[g];
      if (!p) continue;
      min = Math.min(min, p.min);
      max = Math.max(max, p.max);
    }
  }
  if (!isFinite(min)) return null;
  const pad = (max - min) * 0.06 || 1;
  return { min: Math.max(0, min - pad), max: max + pad };
}

function xPct(value, domain) {
  return (value - domain.min) / (domain.max - domain.min) * 100;
}

// Picks a "nice" tick step (1/2/5/10 x a power of ten) rather than dividing
// the range into arbitrary decimals.
function niceStep(rough) {
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  const step = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  return step * mag;
}

function niceTicks(domain, targetCount) {
  const step = niceStep((domain.max - domain.min) / targetCount) || 1;
  const start = Math.ceil(domain.min / step) * step;
  const ticks = [];
  for (let v = start; v <= domain.max + 1e-9; v += step) ticks.push(Math.round(v * 100) / 100);
  return ticks;
}

function priceAxis(domain) {
  const ticks = niceTicks(domain, 5);
  const svg = svgEl('svg', { viewBox: '0 0 100 4', preserveAspectRatio: 'none', class: 'price-axis-svg' },
    svgEl('line', { x1: 0, y1: 0, x2: 100, y2: 0, stroke: 'var(--border)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }));
  const tickWrap = el('div', 'price-axis-ticks');
  for (const t of ticks) {
    const label = el('span', 'price-axis-tick-label', `${t.toFixed(2)}`);
    label.style.left = `${xPct(t, domain)}%`;
    tickWrap.append(label);
  }
  return el('div', 'price-grid price-axis-row', [el('div'), el('div', null, [svg, tickWrap])]);
}

// Nudges the median value label's anchor so it doesn't run off the left/
// right edge of its own chart near the domain extremes.
function clampLabel(labelEl, pct) {
  labelEl.classList.remove('edge-start', 'edge-end');
  if (pct < 8) labelEl.classList.add('edge-start');
  else if (pct > 92) labelEl.classList.add('edge-end');
}

function priceRow(group, stat, domain, colorVar, label) {
  const y = 13, half = 7;
  const xMin = xPct(stat.min, domain), xMax = xPct(stat.max, domain);
  const xP25 = xPct(stat.p25, domain), xP75 = xPct(stat.p75, domain);
  const xMed = xPct(stat.median, domain);

  const svg = svgEl('svg', { viewBox: '0 0 100 26', preserveAspectRatio: 'none', class: 'price-row-svg' }, [
    svgEl('line', { x1: xMin, y1: y, x2: xMax, y2: y, stroke: `var(${colorVar})`, 'stroke-width': 2, 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke' }),
    svgEl('rect', { x: xP25, y: y - half, width: Math.max(xP75 - xP25, 0.4), height: half * 2, rx: 1, fill: `var(${colorVar})`, 'fill-opacity': 0.35, stroke: `var(${colorVar})`, 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke' }),
    svgEl('line', { x1: xMed, y1: y - half, x2: xMed, y2: y + half, stroke: 'var(--text)', 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke' }),
  ]);

  const medLabel = el('span', 'price-median-label', stat.median.toFixed(2));
  medLabel.style.left = `${xMed}%`;
  clampLabel(medLabel, xMed);

  const wrap = el('div', 'price-mark-wrap', [svg, medLabel]);
  wrap.tabIndex = 0;
  wrap.setAttribute('aria-label',
    `${label}: min ${stat.min.toFixed(2)}, p25 ${stat.p25.toFixed(2)}, median ${stat.median.toFixed(2)}, p75 ${stat.p75.toFixed(2)}, max ${stat.max.toFixed(2)}, n=${stat.n}`);
  attachTooltip(wrap, () => [
    { text: `${label} (n=${stat.n})` },
    { text: `min ${stat.min.toFixed(2)} · p25 ${stat.p25.toFixed(2)} · median ${stat.median.toFixed(2)} · p75 ${stat.p75.toFixed(2)} · max ${stat.max.toFixed(2)}`, strong: true },
  ]);

  return el('div', 'price-grid', [el('div', 'price-group-label', label), wrap]);
}

function renderPriceSection(stats, state) {
  const strings = STRINGS[state.lang];
  const section = el('section', 'stat-section');
  section.append(el('h2', null, strings.priceSectionTitle));
  section.append(el('p', 'section-note', strings.priceSectionNote));

  const groups = computePriceGroups(stats);
  const domain = computePriceDomain(stats.facilities, groups);
  if (!domain) {
    section.append(el('div', 'empty-note', strings.priceEmptyNote));
    return section;
  }

  const { colorVars, labels } = priceGroupMaps(groups, strings);
  section.append(renderLegend(groups, labels, colorVars));
  section.append(el('div', 'price-axis-caption', strings.priceAxisCaption));
  section.append(priceAxis(domain));

  let any = false;
  for (const f of stats.facilities) {
    const rowGroups = groups.filter(g => f.prices && f.prices[g]);
    if (rowGroups.length === 0) continue;
    any = true;
    const cov = coverageNote(f, stats.dateRange, strings);
    const heading = el('h3', null, displayName(f, strings));
    if (cov) heading.append(el('span', 'coverage-note', ` · ${cov}`));
    const block = el('div', 'price-facility', heading);
    for (const g of rowGroups) block.append(priceRow(g, f.prices[g], domain, colorVars[g], labels[g]));
    section.append(block);
  }
  if (!any) section.append(el('div', 'empty-note', strings.priceEmptyNote));
  return section;
}

// ---------------------------------------------------------------------------
// Section 3 — dish ledger: every dish seen, with a next-serving prediction
// once it has recurred enough to support one.
// ---------------------------------------------------------------------------

// Read-only mirror of index.html's RATINGS_KEY/loadRatings — same storage
// contract (0-5 stars, ISO ts, pruned after a year), but this page never
// rates anything itself, so pruning here only drops stale entries from the
// in-memory result; unlike index.html it never writes the prune back to
// localStorage. dish.id from stats.json is the same numeric id ratings are
// keyed on, so the lookup here is direct (no provisional "name:" keys to
// resolve — that migration is index.html's job, on next visit there).
const RATINGS_KEY = 'mensaDishRatings';
const RATING_MAX_AGE_MS = 365 * 24 * 60 * 60 * 1000; // 1 year

// Never throws: corrupt JSON, out-of-range stars, bad timestamps or a
// missing localStorage (private browsing) all just yield {}.
function loadRatings() {
  let raw;
  try {
    raw = localStorage.getItem(RATINGS_KEY);
  } catch (err) {
    return {};
  }
  if (!raw) return {};
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (err) {
    return {};
  }
  if (!parsed || typeof parsed !== 'object') return {};
  const now = Date.now();
  const valid = {};
  for (const [key, entry] of Object.entries(parsed)) {
    const stars = entry && entry.stars;
    const time = entry && Date.parse(entry.ts);
    const ok = Number.isInteger(stars) && stars >= 0 && stars <= 5 &&
      !Number.isNaN(time) && now - time <= RATING_MAX_AGE_MS;
    if (ok) valid[key] = entry;
  }
  return valid;
}

// Zurich calendar date for "today", matching index.html's zurichDateParts/
// formatDate pattern — never the viewer's own timezone (same rationale as
// formatDataAsOf above).
function zurichTodayISO(d = new Date()) {
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Zurich', year: 'numeric', month: '2-digit', day: '2-digit',
  }).formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
  return `${parts.year}-${parts.month}-${parts.day}`;
}

// Last sighting strictly before "today" — d.dates is sorted ascending, so
// this walks from the end and skips today's entry. Returns null when the
// dish's only sighting so far is today (a brand-new dish's first day),
// which is the common case while the archive is this thin.
function previousLastSeenDate(dish, todayISO) {
  const dates = dish.dates || [];
  for (let i = dates.length - 1; i >= 0; i--) {
    if (dates[i] < todayISO) return dates[i];
  }
  return null;
}

// Accent- and case-insensitive substring match, no dependency: NFD splits
// each accented character into base + combining mark(s), which are then
// stripped, so "Älpler" normalizes the same as "alpler".
function normalizeForSearch(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

// Matches on both language names regardless of which one is displayed, so a
// German search works while the page is in English and vice versa.
function matchesQuery(dish, normalizedQuery) {
  if (!normalizedQuery) return true;
  return normalizeForSearch(dish.name).includes(normalizedQuery) ||
    normalizeForSearch(dish.nameDe || dish.name).includes(normalizedQuery);
}

function predictionCell(pred, strings) {
  if (!pred) return el('span', 'muted-dash', '—');
  const sigma = pred.sigmaWeekdays;
  // Just the date and the uncertainty in weekdays. The earliest/latest dates
  // stay in stats.json for anyone analysing it, but spelling the interval out
  // again here only repeated what ±N already says.
  return el('span', null, sigma == null ? pred.nextDate
    : `${pred.nextDate} ±${sigma.toFixed(1)} ${strings.weekdaysUnit}`);
}

function dietBadge(diet, strings) {
  const dot = el('span', 'diet-badge-dot');
  dot.style.background = `var(${DIET_COLOR_VAR[diet] || '--muted'})`;
  return el('span', 'diet-badge', [dot, strings.diet[diet] || diet]);
}

// priceGroups defaults to the compile-time-known list so the top-level
// ALL_COLUMN_KEYS call (below, evaluated before stats.json is fetched) still
// resolves; renderDishSection passes stats.priceGroups once it's loaded, so
// group order/labels come from the data rather than being hardcoded twice.
function dishColumns(strings, priceGroups = PRICE_GROUPS_KNOWN) {
  return [
    { key: 'name', label: strings.colDish },
    { key: 'facility', label: strings.colFacility },
    { key: 'diet', label: strings.colDiet },
    { key: 'rating', label: strings.colRating },
    { key: 'count', label: strings.colTimesSeen },
    { key: 'firstSeen', label: strings.colFirstSeen },
    { key: 'lastSeen', label: strings.colLastSeen },
    { key: 'meanGapWeekdays', label: strings.colMeanGap },
    { key: 'nextDate', label: strings.colNextServing },
    ...priceGroups.map(g => ({ key: `price_${g}`, label: `${strings.colPricePrefix} · ${strings.priceGroups[g] || g}` })),
  ];
}

// Column visibility is a display preference the reader sets once and expects
// to stick — a plain localStorage key, not the 5-minute-TTL cache helper
// index.html uses for API responses (index.html:237), which would discard it
// almost immediately. Keys are language-independent, so STRINGS.en is enough
// to enumerate them.
const COLUMN_PREFS_KEY = 'mensaStatsLedgerColumns';
const DEFAULT_COLUMN_KEYS = ['name', 'facility', 'diet', 'rating', 'count', 'lastSeen', 'meanGapWeekdays', 'nextDate'];
const ALL_COLUMN_KEYS = dishColumns(STRINGS.en).map(c => c.key);

// Unknown/removed keys are dropped rather than rejecting the whole list, and
// an empty or unusable result falls back to the default — so a future change
// to the column set, or a hand-edited/corrupt value, can never strand
// someone with a broken or empty table.
// Stored as {visible, known}: `known` records which columns existed when the
// choice was last made, so a column added later is genuinely new rather than
// deliberately switched off, and can adopt its default. Without that, every
// future column would be invisible to anyone who had ever touched the chooser
// — silently, which is the worst way for a feature to not exist. A bare array
// is the pre-{visible,known} format and is still read.
function loadColumnPrefs() {
  try {
    const raw = localStorage.getItem(COLUMN_PREFS_KEY);
    if (!raw) return DEFAULT_COLUMN_KEYS.slice();
    const parsed = JSON.parse(raw);
    const stored = Array.isArray(parsed) ? parsed : parsed && parsed.visible;
    const known = Array.isArray(parsed) ? parsed : (parsed && parsed.known) || [];
    if (!Array.isArray(stored)) return DEFAULT_COLUMN_KEYS.slice();
    const valid = stored.filter(k => ALL_COLUMN_KEYS.includes(k));
    // Columns the reader has never been offered adopt their default.
    const unseen = DEFAULT_COLUMN_KEYS.filter(
      k => !known.includes(k) && !valid.includes(k) && ALL_COLUMN_KEYS.includes(k));
    const merged = ALL_COLUMN_KEYS.filter(k => valid.includes(k) || unseen.includes(k));
    return merged.length ? merged : DEFAULT_COLUMN_KEYS.slice();
  } catch (err) {
    return DEFAULT_COLUMN_KEYS.slice();
  }
}

function saveColumnPrefs(keys) {
  try {
    localStorage.setItem(COLUMN_PREFS_KEY,
      JSON.stringify({ visible: keys, known: ALL_COLUMN_KEYS.slice() }));
  } catch (err) {
    // Private browsing or a full quota — the choice just won't persist.
  }
}

// nameDe falls back to the English name server-side (always non-empty), so
// this only needs to guard against an older stats.json predating the field.
function dishDisplayName(d, lang) {
  return lang === 'de' ? (d.nameDe || d.name) : d.name;
}

// ratings is only consulted for key === 'rating' — every other column reads
// straight off the dish object, same as before this column existed.
function sortValue(dish, key, lang, todayISO, ratings) {
  if (key === 'nextDate') return dish.prediction ? dish.prediction.nextDate : null;
  if (key === 'name') return dishDisplayName(dish, lang);
  if (key === 'lastSeen') return previousLastSeenDate(dish, todayISO);
  if (key === 'rating') {
    const entry = ratings[dish.id]; // dish.id (number) coerces fine as a key
    return entry ? entry.stars : null; // null (unrated) sorts last either way, same as the other columns below
  }
  if (key.startsWith('price_')) {
    const p = dish.prices && dish.prices[key.slice(6)];
    return p ? p.mean : null;
  }
  return dish[key];
}

function compareDishes(a, b, key, dir, lang, todayISO, ratings) {
  const av = sortValue(a, key, lang, todayISO, ratings), bv = sortValue(b, key, lang, todayISO, ratings);
  if (av == null && bv == null) return 0;
  if (av == null) return 1;   // nulls always sort last, regardless of direction
  if (bv == null) return -1;
  const base = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
  return base * dir;
}

// One cell-builder per column key, closed over the language/date context, so
// buildDishTable can render whatever subset of dishColumns() is currently
// visible without needing its own display logic per column.
// priceGroups mirrors the list dishColumns() was built with, so a
// price_<group> column key always has a matching cell builder.
function dishCellBuilders(strings, lang, todayISO, priceGroups = PRICE_GROUPS_KNOWN, ratings = {}) {
  const builders = {
    name: d => el('td', null, dishDisplayName(d, lang)),
    facility: d => el('td', null, d.facility),
    diet: d => el('td', null, dietBadge(d.diet, strings)),
    // "n/5" rather than star glyphs: at 380px it stays legible and, unlike a
    // row of filled/empty stars, "0/5" vs. the unrated muted-dash can never
    // be confused for each other.
    rating: d => {
      const entry = ratings[d.id];
      return el('td', null, entry ? `${entry.stars}/5` : el('span', 'muted-dash', '—'));
    },
    count: d => el('td', null, String(d.count)),
    firstSeen: d => el('td', null, d.firstSeen),
    lastSeen: d => {
      const prev = previousLastSeenDate(d, todayISO);
      return el('td', null, prev ? prev : el('span', 'muted-dash', '—'));
    },
    meanGapWeekdays: d => el('td', null, d.meanGapWeekdays == null ? el('span', 'muted-dash', '—') : d.meanGapWeekdays.toFixed(1)),
    nextDate: d => el('td', null, predictionCell(d.prediction, strings)),
  };
  // Absent `prices`, an absent group within it, or n<2 (sd: null) all render
  // as a plain dash — a lone observation has no deviation to show, and is
  // not the same thing as a price that has been confirmed stable at 0.00.
  for (const g of priceGroups) {
    builders[`price_${g}`] = d => {
      const p = d.prices && d.prices[g];
      if (!p) return el('td', null, el('span', 'muted-dash', '—'));
      const text = p.sd == null ? p.mean.toFixed(2) : `${p.mean.toFixed(2)} ± ${p.sd.toFixed(2)}`;
      return el('td', null, text);
    };
  }
  return builders;
}

// Full sentence per language, same "n von 5 Sternen" phrasing index.html's
// starLabel() uses — built directly rather than through STRINGS since it
// needs the count/mean interpolated in different word order per language
// (same pattern as renderHeader's dateLine text further below).
function ratingSummaryText(count, mean, strings, lang) {
  const avg = mean.toFixed(1);
  return lang === 'de'
    ? `${count} ${strings.dishesUnit} bewertet — im Schnitt ${avg} von 5 Sternen.`
    : `${count} ${strings.dishesUnit} rated — average ${avg} of 5 stars.`;
}

// Count + mean over every valid rating this browser holds, regardless of
// whether that dish is currently visible in the (filtered) ledger below —
// "how many dishes have I rated", not "how many of the currently-shown rows
// are rated".
function renderRatingSummary(ratings, strings, lang) {
  const entries = Object.values(ratings);
  if (entries.length === 0) return el('div', 'empty-note', strings.ratedNoneNote);
  const mean = entries.reduce((sum, e) => sum + e.stars, 0) / entries.length;
  return el('p', 'section-note', ratingSummaryText(entries.length, mean, strings, lang));
}

function buildDishTable(rows, columns, cellBuilders, sortKey, sortDir, strings, onSort) {
  const headRow = el('tr', null, columns.map(col => {
    const th = el('th', 'sortable', [col.label, col.key === sortKey ? el('span', 'sort-arrow', sortDir === 1 ? ' ▲' : ' ▼') : null]);
    th.addEventListener('click', () => onSort(col.key));
    return th;
  }));
  const tbody = el('tbody');
  if (rows.length === 0) {
    const cell = el('td', null, strings.noDishesMatch);
    cell.colSpan = columns.length;
    tbody.append(el('tr', null, cell));
  }
  for (const d of rows) {
    tbody.append(el('tr', null, columns.map(col => cellBuilders[col.key](d))));
  }
  return el('table', 'data-table', [el('thead', null, headRow), tbody]);
}

// Sort column/direction, facility filter, search query and "only predicted"
// live on the shared `state` object (alongside state.lang) rather than as
// local closure variables, so a full re-render on language toggle can
// rebuild this section from scratch and still come back up in the same
// place. Column visibility lives on state too, but is seeded from
// localStorage (see loadColumnPrefs) rather than URL/defaults.
function renderDishSection(stats, state) {
  const strings = STRINGS[state.lang];
  const section = el('section', 'stat-section');
  section.append(el('h2', null, strings.dishLedgerTitle));
  section.append(el('p', 'section-note', strings.dishLedgerNote));

  // Choose 5 is a build-your-own counter, not a dish — leave it out of the
  // ledger (dishes.csv and the archive keep the full record; only this
  // client-side view excludes it).
  const dishes = stats.dishes.filter(d => d.name !== CHOOSE_5_NAME);
  const todayISO = zurichTodayISO();
  // Read-only: rating happens on the menu page, this page only ever reads
  // mensaDishRatings, never writes it.
  const ratings = loadRatings();
  section.append(renderRatingSummary(ratings, strings, state.lang));

  const facilities = [...new Set(dishes.map(d => d.facility))].sort();
  const ALL_FACILITIES_VALUE = ''; // stable sentinel, independent of the translated label
  const allOption = el('option', null, strings.allFacilities);
  allOption.value = ALL_FACILITIES_VALUE;
  const facilitySelect = el('select', null, [
    allOption,
    ...facilities.map(f => el('option', null, f)),
  ]);
  facilitySelect.value = state.dishFacility;
  const onlyPredicted = el('input');
  onlyPredicted.type = 'checkbox';
  onlyPredicted.checked = state.onlyPredicted;
  const ratedOnly = el('input');
  ratedOnly.type = 'checkbox';
  ratedOnly.checked = state.ratedOnly;
  const searchInput = el('input');
  searchInput.type = 'text';
  searchInput.placeholder = strings.searchPlaceholder;
  searchInput.setAttribute('aria-label', strings.searchPlaceholder);
  searchInput.value = state.dishQuery;
  const controls = el('div', 'ledger-controls', [
    el('label', null, [onlyPredicted, ` ${strings.onlyPredictedLabel}`]),
    el('label', null, [ratedOnly, ` ${strings.ratedOnlyLabel}`]),
    el('label', null, [`${strings.colFacility}: `, facilitySelect]),
    searchInput,
  ]);
  section.append(controls);

  // Column chooser: canonical dishColumns() order (not selection order), and
  // at least one column always stays checked so the table can't vanish.
  const priceGroups = stats.priceGroups && stats.priceGroups.length ? stats.priceGroups : PRICE_GROUPS_KNOWN;
  const allColumns = dishColumns(strings, priceGroups);
  const columnChooser = el('div', 'column-chooser', el('span', 'column-chooser-label', `${strings.columnsLabel}:`));
  for (const col of allColumns) {
    const cb = el('input');
    cb.type = 'checkbox';
    cb.checked = state.dishColumns.includes(col.key);
    cb.addEventListener('change', () => {
      if (cb.checked) {
        if (!state.dishColumns.includes(col.key)) state.dishColumns = [...state.dishColumns, col.key];
      } else {
        const next = state.dishColumns.filter(k => k !== col.key);
        if (next.length === 0) { cb.checked = true; return; } // keep at least one column on
        state.dishColumns = next;
      }
      saveColumnPrefs(state.dishColumns);
      rerender();
    });
    columnChooser.append(el('label', null, [cb, ` ${col.label}`]));
  }
  section.append(columnChooser);

  const tableWrap = el('div', 'table-wrap');
  section.append(tableWrap);

  function rerender() {
    const normalizedQuery = normalizeForSearch(state.dishQuery.trim());
    let rows = dishes.filter(d =>
      (!state.onlyPredicted || d.prediction) &&
      (!state.ratedOnly || ratings[d.id]) &&
      (state.dishFacility === ALL_FACILITIES_VALUE || d.facility === state.dishFacility) &&
      matchesQuery(d, normalizedQuery));
    rows = rows.slice().sort((a, b) => compareDishes(a, b, state.dishSortKey, state.dishSortDir, state.lang, todayISO, ratings));
    const visibleColumns = allColumns.filter(c => state.dishColumns.includes(c.key));
    const cellBuilders = dishCellBuilders(strings, state.lang, todayISO, priceGroups, ratings);
    tableWrap.replaceChildren(buildDishTable(rows, visibleColumns, cellBuilders, state.dishSortKey, state.dishSortDir, strings, key => {
      state.dishSortDir = (state.dishSortKey === key) ? -state.dishSortDir : -1;
      state.dishSortKey = key;
      rerender();
    }));
  }
  onlyPredicted.addEventListener('change', () => { state.onlyPredicted = onlyPredicted.checked; rerender(); });
  ratedOnly.addEventListener('change', () => { state.ratedOnly = ratedOnly.checked; rerender(); });
  facilitySelect.addEventListener('change', () => { state.dishFacility = facilitySelect.value; rerender(); });
  searchInput.addEventListener('input', () => {
    state.dishQuery = searchInput.value;
    updateUrl(state);
    rerender();
  });
  rerender();
  return section;
}

// ---------------------------------------------------------------------------
// Section 4 — today: what's on offer right now, per facility, filtered from
// the same stats.dishes[] the ledger uses (no separate extraction). Rendered
// first on the page (see render()) even though it's defined last here, since
// it reuses dietRow()/dietStatsExcludingChoose5() from section 1 above and
// previousLastSeenDate()/dishDisplayName() from section 3 — JS function
// declarations are hoisted, so definition order doesn't affect this.
// ---------------------------------------------------------------------------

// Today's per-facility diet tally, shaped like a stats.facilities entry so it
// can go straight into dietRow() — the same bar/tooltip/aria-label code the
// diet-mix section already uses, just fed a one-day slice instead of the
// archive. `name` doubles as the row label dietRow() prints (see displayName),
// which is why it's set to a translated "Today" rather than the facility name
// — the facility name is already the block heading above both rows.
function todayDietPseudoFacility(dishesToday, todayISO, strings) {
  const diet = { vegan: 0, vegetarian: 0, fish: 0, meat: 0, unclassified: 0 };
  for (const d of dishesToday) diet[d.diet] = (diet[d.diet] || 0) + 1;
  return { name: strings.todayLabel, diet, dishDays: dishesToday.length, firstSeen: todayISO, lastSeen: todayISO };
}

function renderTodaySection(stats, state) {
  const strings = STRINGS[state.lang];
  const section = el('section', 'stat-section');
  section.append(el('h2', null, strings.todaySectionTitle));
  section.append(el('p', 'section-note', strings.todaySectionNote));

  const todayISO = zurichTodayISO();
  // Choose 5 is excluded here too, same as the ledger and diet-mix sections —
  // it's a build-your-own counter, not a dish.
  const dishesToday = stats.dishes.filter(d => d.name !== CHOOSE_5_NAME && (d.dates || []).includes(todayISO));
  if (dishesToday.length === 0) {
    section.append(el('div', 'empty-note', strings.todayEmptyNote));
    return section;
  }

  const { facilities: archiveFacilities } = dietStatsExcludingChoose5(stats);
  const archiveByName = new Map(archiveFacilities.map(f => [f.name, f]));

  const byFacility = new Map();
  for (const d of dishesToday) {
    if (!byFacility.has(d.facility)) byFacility.set(d.facility, []);
    byFacility.get(d.facility).push(d);
  }

  // Canonical facility order (stats.facilities, ultimately from websites.txt),
  // not insertion order, so this stays consistent with the rest of the page.
  for (const f of stats.facilities) {
    const dishes = byFacility.get(f.name);
    if (!dishes || dishes.length === 0) continue;
    const block = el('div', 'today-facility');
    block.append(el('h3', null, f.name));

    block.append(dietRow(todayDietPseudoFacility(dishes, todayISO, strings), false, { from: todayISO, to: todayISO }, strings));
    const archiveFacility = archiveByName.get(f.name);
    if (archiveFacility) {
      block.append(dietRow({ ...archiveFacility, name: strings.archiveWideLabel }, false, stats.dateRange, strings));
    }

    const table = el('table', 'data-table', [
      el('thead', null, el('tr', null, [el('th', null, strings.colDish), el('th', null, strings.todayPreviouslyLabel)])),
      el('tbody', null, dishes.map(d => {
        const prev = previousLastSeenDate(d, todayISO);
        return el('tr', null, [
          el('td', null, dishDisplayName(d, state.lang)),
          el('td', null, prev ? prev : el('span', 'muted-dash', strings.firstTimeLabel)),
        ]);
      })),
    ]);
    block.append(el('div', 'table-wrap', table));
    section.append(block);
  }
  return section;
}

// ---------------------------------------------------------------------------
// Section 5 — counters: every dish seen on each serving counter (stats.lines),
// which doubles as the substitution list (dish A replaced by dish B on the
// same counter). Dishes that share a date with another dish on the same
// counter ran together as same-day alternatives, not a substitution — cheap
// to tell apart because each dish already carries its own `dates` array, so
// this is a same-date lookup, not a name-similarity heuristic.
// ---------------------------------------------------------------------------

// Dishes on one counter that share at least one serving date with another
// dish on that same counter — same-day alternatives (e.g. a protein swap),
// not a day-to-day substitution. Returns a Set of dish objects (not indices),
// so the caller can sort the list freely without losing the marking.
function sameDayVariantDishes(dishes) {
  const byDate = new Map();
  for (const d of dishes) {
    for (const date of d.dates || []) {
      if (!byDate.has(date)) byDate.set(date, []);
      byDate.get(date).push(d);
    }
  }
  const variants = new Set();
  for (const group of byDate.values()) {
    if (group.length > 1) group.forEach(d => variants.add(d));
  }
  return variants;
}

// One counter's history, collapsed behind a native <details> so a 19-dish
// counter (fire, grill) doesn't dominate the page — no JS toggle state
// needed, and it degrades fine with scripting off.
function counterBlock(line, lang, strings) {
  const variants = sameDayVariantDishes(line.dishes);
  const sorted = line.dishes.slice().sort((a, b) => a.firstSeen.localeCompare(b.firstSeen));
  const list = el('ul', 'counter-dish-list', sorted.map(d => {
    const range = d.count > 1 ? `${d.firstSeen} – ${d.lastSeen} (${d.count}×)` : d.firstSeen;
    return el('li', null, [
      `${dishDisplayName(d, lang)} — ${range}`,
      variants.has(d) ? el('span', 'variant-badge', ` · ${strings.sameDayLabel}`) : null,
    ]);
  }));
  const details = el('details', 'counter-block', [
    el('summary', null, `${line.line} — ${line.dishes.length} ${strings.dishesUnit}`),
    list,
  ]);
  return details;
}

function renderCountersSection(stats, state) {
  const strings = STRINGS[state.lang];
  const section = el('section', 'stat-section');
  section.append(el('h2', null, strings.countersSectionTitle));
  section.append(el('p', 'section-note', strings.countersSectionNote));

  if (!stats.lines || stats.lines.length === 0) {
    section.append(el('div', 'empty-note', strings.countersEmptyNote));
    return section;
  }

  // stats.lines is already grouped by facility upstream; a facility heading
  // goes up whenever it changes.
  let currentFacility = null;
  for (const line of stats.lines) {
    if (line.facility !== currentFacility) {
      currentFacility = line.facility;
      section.append(el('h3', null, currentFacility));
    }
    section.append(counterBlock(line, state.lang, strings));
  }
  return section;
}

// ---------------------------------------------------------------------------

// Always Europe/Zurich wall-clock, DST included. The zone is pinned rather
// than using the viewer's own, so the label means the same thing wherever
// it's read — but the offset follows the real CEST/CET switchover instead
// of being frozen at +2, and the printed abbreviation says which one it is.
function formatDataAsOf(iso, strings) {
  if (!iso) return strings.unknownTime;
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  // en-GB for the zone abbreviation: it yields "CEST"/"CET", where en-CA
  // and en-US both degrade to "GMT+2". Date order is irrelevant — the parts
  // are reassembled into ISO below. The abbreviation itself is left as-is in
  // German too — it's the same standard short form either language.
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Zurich', hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', timeZoneName: 'short',
  }).formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
  return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute} ${parts.timeZoneName}`;
}

function renderHeader(stats, state) {
  const strings = STRINGS[state.lang];
  const r = stats.dateRange;
  const asOf = formatDataAsOf(stats.dataAsOf, strings);
  // Fresh clone / first deploy: r.from/r.to are null and days is 0 (the
  // generator no longer crashes on an empty archive, it emits this instead).
  if (!r.days || r.from == null) {
    document.getElementById('dateLine').textContent = strings.noDataYet;
    return;
  }
  document.getElementById('dateLine').textContent = state.lang === 'de'
    ? `Zeitraum ${r.from} bis ${r.to} (${r.days} Tage) — Datenstand: ${asOf}`
    : `Covering ${r.from} to ${r.to} (${r.days} days) — data as of ${asOf}`;
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// Same ?lang= convention as index.html: default 'en', reflected into the URL.
// The search query (?q=) is URL-driven too, so a search is linkable. The
// rest of the ledger's sort/filter state starts at its defaults on a fresh
// load but survives a language toggle in-session (see main()), since
// renderDishSection reads/writes it on `state`. Column visibility isn't
// URL-driven at all — it's seeded from localStorage (loadColumnPrefs).
function getStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return {
    lang: params.get('lang') === 'de' ? 'de' : 'en',
    dishSortKey: 'count',
    dishSortDir: -1, // count desc, as delivered
    dishFacility: '', // '' = all facilities
    dishQuery: params.get('q') || '',
    onlyPredicted: false,
    ratedOnly: false,
    dietTableVisible: false,
    dishColumns: loadColumnPrefs(),
  };
}

function updateUrl(state) {
  const params = new URLSearchParams(window.location.search);
  params.set('lang', state.lang);
  if (state.dishQuery) params.set('q', state.dishQuery);
  else params.delete('q');
  history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
}

function updateToggleButtons(state) {
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
  document.getElementById('langGroup').setAttribute('aria-label', STRINGS[state.lang].languageLabel);
}

// Carries the current language across to index.html, mirroring the fix on
// that page's own link back here (TODO item 1).
function updateBackLink(state) {
  const link = document.getElementById('backLink');
  link.href = `index.html?lang=${state.lang}`;
  link.textContent = `← ${STRINGS[state.lang].backLinkLabel}`;
}

async function main() {
  const state = getStateFromUrl();
  updateUrl(state);
  updateToggleButtons(state);
  updateBackLink(state);

  const app = document.getElementById('app');
  let stats = null;
  let loadFailed = false;

  // Renders whatever the current load state is (loading / error / loaded)
  // under the current language — called on first paint, once the fetch
  // settles, and again on every language toggle so the whole page (not just
  // the dish table) re-renders, while state.* above keeps the ledger's
  // sort/filter/visibility choices intact across that rebuild.
  function render() {
    const strings = STRINGS[state.lang];
    document.documentElement.lang = state.lang;
    document.title = strings.title;
    document.getElementById('titleText').textContent = strings.title;
    app.innerHTML = '';
    if (loadFailed) {
      app.append(el('div', 'error-note', strings.loadError));
      return;
    }
    if (!stats) {
      app.append(el('div', 'loading', strings.loading));
      return;
    }
    renderHeader(stats, state);
    app.append(renderTodaySection(stats, state));
    app.append(renderDietSection(stats, state));
    app.append(renderPriceSection(stats, state));
    app.append(renderCountersSection(stats, state));
    app.append(renderDishSection(stats, state));
    // Label-fit and edge-clamp checks need real layout, so they run after
    // the browser has actually painted the new DOM.
    requestAnimationFrame(() => fitDietLabels(app));
  }

  document.querySelectorAll('[data-lang]').forEach(btn => btn.addEventListener('click', () => {
    if (state.lang === btn.dataset.lang) return;
    state.lang = btn.dataset.lang;
    updateUrl(state);
    updateToggleButtons(state);
    updateBackLink(state);
    render();
  }));

  render();

  try {
    const res = await fetch('data/stats.json');
    if (!res.ok) throw new Error('missing');
    stats = await res.json();
  } catch (err) {
    loadFailed = true;
  }
  render();

  window.addEventListener('resize', debounce(() => fitDietLabels(app), 150));
}

main();
</script>
</body>
</html>
